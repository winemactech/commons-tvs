<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Commons TVs</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: clamp(1.5rem, 3vh, 3rem);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2vw, 2rem);
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 1.5vh, 1.5rem);
      margin-bottom: clamp(1.5rem, 3vh, 3rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 8vh, 90px);
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(1.8rem, 4vh, 3rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .menu-container {
      flex: 1;
      display: flex;
      gap: clamp(1rem, 2vw, 2rem);
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .menu-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1rem, 2vh, 2rem) clamp(1.5rem, 2.5vw, 2.5rem);
      text-align: center;
      text-decoration: none;
      color: var(--patriots-white);
      transition: all 0.25s ease;
      flex: 1 1 clamp(200px, 18vw, 280px);
      max-width: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: clamp(140px, 20vh, 220px);
      outline: none;
    }

    .menu-card:hover,
    .menu-card:focus-visible {
      background-color: rgba(198, 12, 48, 0.2);
      border-color: var(--patriots-silver);
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(198, 12, 48, 0.4);
    }

    .menu-card h2 {
      font-size: clamp(1.2rem, 2.5vh, 1.8rem);
      font-weight: 800;
      margin-bottom: clamp(0.4rem, 1vh, 0.8rem);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-card p {
      font-size: clamp(0.85rem, 1.5vh, 1.05rem);
      color: var(--patriots-silver);
      font-weight: 500;
      line-height: 1.3;
    }

    footer {
      padding-top: clamp(0.5rem, 1vh, 1rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.8rem, 1.3vh, 1rem);
      opacity: 0.8;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Win-E-Mac Commons Display</h1>
  </header>

  <main class="menu-container">
    <a href="bulletin.html" class="menu-card">
      <h2>Bulletin</h2>
      <p>Daily announcements</p>
    </a>
    <a href="events.html" class="menu-card">
      <h2>Upcoming Events</h2>
      <p>Upcoming school events</p>
    </a>
    <a href="breakfast-lunch.html" class="menu-card">
      <h2>Breakfast & Lunch</h2>
      <p>Today's and tomorrow's menus</p>
    </a>
    <a href="workshops.html" class="menu-card">
      <h2>Workshops</h2>
      <p>Upcoming workshops</p>
    </a>
    <a href="birthdays.html" class="menu-card">
      <h2>Birthdays</h2>
      <p>Student and staff birthdays</p>
    </a>
  </main>

  <footer>Win-E-Mac Patriots Commons Display</footer>

  <script>
    (function() {
      const INACTIVITY_TIMEOUT = 30000; // 30 seconds in milliseconds
      const TARGET_PAGE = 'bulletin.html';
      let inactivityTimer;

      function redirectToBulletin() {
        window.location.href = TARGET_PAGE;
      }

      function resetTimer() {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(redirectToBulletin, INACTIVITY_TIMEOUT);
      }

      // Track interaction events across mouse, keyboard, and touch devices
      const interactionEvents = ['mousemove', 'mousedown', 'keypress', 'touchstart', 'scroll'];

      interactionEvents.forEach(event => {
        window.addEventListener(event, resetTimer, { passive: true });
      });

      // Initialize timer on load
      resetTimer();
    })();
  </script>

</body>
</html>
