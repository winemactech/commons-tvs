<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Commons TV</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 3rem;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: 1.5rem;
      margin-bottom: 3rem;
    }

    .logo {
      height: 100px;
      width: auto;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .menu-container {
      flex: 1;
      display: flex;
      gap: 3rem;
      justify-content: center;
      align-items: center;
    }

    .menu-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 3rem 4rem;
      text-align: center;
      text-decoration: none;
      color: var(--patriots-white);
      transition: all 0.3s ease;
      flex: 1;
      max-width: 300px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 250px;
    }

    .menu-card:hover {
      background-color: rgba(198, 12, 48, 0.1);
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(198, 12, 48, 0.3);
    }

    .menu-card h2 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-card p {
      font-size: 1.2rem;
      color: var(--patriots-silver);
      font-weight: 500;
    }

    footer {
      padding-top: 1rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Commons TV Menu</h1>
  </header>

  <div class="menu-container">
    <a href="events.html" class="menu-card">
      <h2>Events</h2>
      <p>Upcoming school events and activities</p>
    </a>
    <a href="birthdays.html" class="menu-card">
      <h2>Birthdays</h2>
      <p>Student and staff birthdays</p>
    </a>
  </div>

  <footer>Win-E-Mac Patriots Commons Display</footer>

</body>
</html>
