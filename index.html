<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Events</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 3rem;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo {
      height: 80px;
      width: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .events-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .event-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-top: 1px solid rgba(176, 183, 188, 0.15);
      border-right: 1px solid rgba(176, 183, 188, 0.15);
      border-bottom: 1px solid rgba(176, 183, 188, 0.15);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      gap: 2rem;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
      transition: background-color 0.2s;
    }

    .event-card:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .event-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--patriots-white);
    }

    .event-datetime {
      font-size: 1.3rem;
      color: var(--patriots-silver);
      font-weight: 500;
    }

    .event-location {
      font-size: 1.1rem;
      color: var(--patriots-silver);
      font-style: italic;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.2);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: 1.5rem;
      font-size: 1.2rem;
      color: var(--patriots-white);
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: 1.5rem;
      font-size: 1.2rem;
      color: var(--patriots-white);
    }

    /* Footer with refresh info */
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: right;
    }

    /* Scrollbar styling */
    .events-wrapper::-webkit-scrollbar {
      width: 8px;
    }

    .events-wrapper::-webkit-scrollbar-track {
      background: rgba(176, 183, 188, 0.1);
      border-radius: 4px;
    }

    .events-wrapper::-webkit-scrollbar-thumb {
      background: rgba(198, 12, 48, 0.5);
      border-radius: 4px;
    }

    .events-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(198, 12, 48, 0.7);
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Win-E-Mac Events</h1>
  </header>

  <div class="events-wrapper" id="events-container">
    <div class="loading-message">Loading events...</div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Direct Bound iCal Feed URL
    const boundIcalUrl = "https://gobound.com/mn/schools/winemac/calendar/ical/2417b68941d2412";
    
    // Try multiple CORS proxies in case one fails
    const proxyUrls = [
      `https://corsproxy.io/?${encodeURIComponent(boundIcalUrl)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(boundIcalUrl)}`,
      `https://cors-anywhere.herokuapp.com/${boundIcalUrl}`
    ];

    // Parse iCal date format (e.g., "20260822T143000Z" or "20260822")
    function parseICalDate(dateStr) {
      if (!dateStr) return null;
      
      dateStr = dateStr.trim();
      
      if (dateStr.includes('T')) {
        const year = dateStr.substring(0, 4);
        const month = dateStr.substring(4, 6);
        const day = dateStr.substring(6, 8);
        const hour = dateStr.substring(9, 11);
        const minute = dateStr.substring(11, 13);
        return new Date(`${year}-${month}-${day}T${hour}:${minute}:00Z`);
      } else {
        const year = dateStr.substring(0, 4);
        const month = dateStr.substring(4, 6);
        const day = dateStr.substring(6, 8);
        return new Date(`${year}-${month}-${day}T00:00:00Z`);
      }
    }

    // Format date and time for display
    function formatDateForDisplay(dateObj) {
      if (!dateObj) return "TBD";
      
      const options = {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        timeZone: 'America/Chicago'
      };
      
      return dateObj.toLocaleDateString('en-US', options);
    }

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    async function fetchEventsWithRetry() {
      for (let i = 0; i < proxyUrls.length; i++) {
        try {
          const response = await fetch(proxyUrls[i], { 
            method: 'GET',
            timeout: 10000
          });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.text();
          parseAndRenderICS(data);
          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.error(`Proxy ${i + 1} failed:`, error);
          if (i === proxyUrls.length - 1) {
            displayError(`Unable to load events from Bound calendar. Please try refreshing the page.`);
          }
        }
      }
    }

    function displayError(message) {
      const container = document.getElementById('events-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderICS(icsData) {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      const events = [];
      const blocks = icsData.split('BEGIN:VEVENT');

      blocks.slice(1).forEach(block => {
        const summaryMatch = block.match(/SUMMARY:(.*)/);
        const dtstartMatch = block.match(/DTSTART(?:;[^:]*)?:(.*)/);
        const locationMatch = block.match(/LOCATION:(.*)/);

        if (summaryMatch && dtstartMatch) {
          const title = summaryMatch[1].trim();
          const rawDate = dtstartMatch[1].trim();
          const location = locationMatch ? locationMatch[1].trim() : '';
          const dateObj = parseICalDate(rawDate);
          
          events.push({ 
            title, 
            rawDate,
            location,
            dateObj,
            timestamp: dateObj ? dateObj.getTime() : 0
          });
        }
      });

      // Sort events by date and filter out past events
      const now = new Date();
      const upcomingEvents = events
        .filter(evt => evt.dateObj && evt.dateObj > now)
        .sort((a, b) => a.timestamp - b.timestamp)
        .slice(0, 10);

      if (upcomingEvents.length === 0) {
        displayError("No upcoming events scheduled.");
        return;
      }

      // Show upcoming events in three-column layout
      upcomingEvents.forEach(evt => {
        const card = document.createElement('div');
        card.className = 'event-card';
        const formattedDate = formatDateForDisplay(evt.dateObj);
        const locationDisplay = evt.location || 'TBD';
        
        card.innerHTML = `
          <div class="event-title">${evt.title}</div>
          <div class="event-datetime">${formattedDate}</div>
          <div class="event-location">${locationDisplay}</div>
        `;
        container.appendChild(card);
      });
    }

    // Initial Fetch
    fetchEventsWithRetry();

    // Auto-refresh every 15 minutes
    setInterval(fetchEventsWithRetry, 15 * 60 * 1000);
  </script>
</body>
</html>
