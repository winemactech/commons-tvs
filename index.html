<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Commons TVs</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: clamp(1rem, 3%, 3rem);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1.5rem, 3%, 3rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(60px, 14vw, 120px);
      width: auto;
    }

    h1 {
      font-size: clamp(1.5rem, 7vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .menu-container {
      flex: 1;
      display: flex;
      gap: clamp(1rem, 2%, 2rem);
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .menu-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1rem, 2%, 2rem) clamp(1.5rem, 2.5%, 3rem);
      text-align: center;
      text-decoration: none;
      color: var(--patriots-white);
      transition: all 0.3s ease;
      flex: 0 1 clamp(150px, 22%, 250px);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: clamp(150px, 25vh, 250px);
    }

    .menu-card:hover {
      background-color: rgba(198, 12, 48, 0.1);
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(198, 12, 48, 0.3);
    }

    .menu-card h2 {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 800;
      margin-bottom: clamp(0.5rem, 1%, 1rem);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-card p {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      color: var(--patriots-silver);
      font-weight: 500;
      line-height: 1.4;
    }

    footer {
      padding-top: clamp(0.5rem, 1%, 1rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      opacity: 0.7;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Win-E-Mac Commons TVs</h1>
  </header>

  <div class="menu-container">
    <a href="bulletin.html" class="menu-card">
      <h2>Bulletin</h2>
      <p>Daily announcements</p>
    </a>
    <a href="events.html" class="menu-card">
      <h2>Upcoming Events</h2>
      <p>Upcoming school events</p>
    </a>
    <a href="breakfast-lunch.html" class="menu-card">
      <h2>Breakfast & Lunch</h2>
      <p>Today's and tomorrow's menus</p>
    </a>
    <a href="workshops.html" class="menu-card">
      <h2>Workshops</h2>
      <p>Upcoming workshops</p>
    </a>
    <a href="birthdays.html" class="menu-card">
      <h2>Birthdays</h2>
      <p>Student and staff birthdays</p>
    </a>
  </div>

  <footer>Win-E-Mac Patriots Commons Display</footer>

</body>
</html>
