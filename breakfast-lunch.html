<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Breakfast & Lunch</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
      --breakfast-blue: #1E5BA8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      padding: clamp(1.5rem, 3%, 3rem);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 4px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1rem, 2%, 2rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 10vw, 90px);
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: clamp(1rem, 3%, 2rem);
      flex: 1;
      align-items: stretch;
      min-height: 0;
    }

    .menu-card {
      background-color: var(--patriots-red);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1.2rem, 2%, 2rem);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    .menu-card.breakfast {
      background-color: var(--breakfast-blue);
      border-color: var(--breakfast-blue);
    }

    .menu-card-header {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 800;
      color: var(--patriots-white);
      margin-bottom: clamp(0.5rem, 1%, 1rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--patriots-white);
      padding-bottom: clamp(0.5rem, 1%, 1rem);
      flex-shrink: 0;
    }

    .menu-card-date {
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: clamp(0.75rem, 1.5%, 1.2rem);
      font-weight: 600;
      flex-shrink: 0;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: clamp(0.5rem, 1%, 0.8rem);
      flex: 1;
      min-height: 0;
    }

    .menu-item {
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: var(--patriots-white);
      line-height: 1.4;
      padding: clamp(0.3rem, 0.5%, 0.5rem) 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .no-menu {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.8);
      font-style: italic;
    }

    .stale-notice {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 8px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(2rem, 4vw, 4rem);
      font-size: clamp(1.3rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: var(--patriots-white);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .stale-notice .subtext {
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: var(--patriots-silver);
      font-weight: 400;
      margin-top: 1rem;
    }

    footer {
      margin-top: clamp(1rem, 2%, 1.5rem);
      padding-top: clamp(0.5rem, 1%, 0.75rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      opacity: 0.8;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Breakfast & Lunch</h1>
  </header>

  <div class="menu-wrapper" id="menu-container">
    <div class="stale-notice">Loading menu...</div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    const sheetId = "1f2ydFePdNHRrWldHYpJQnYnMFP0zT_UlFN8WtzUMrt0";
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=menus`;

    function getTodayFormatted() {
      return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function getTomorrowFormatted() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      return tomorrow.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function updateLastUpdatedTime() {
      const now = new Date();
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/Chicago'
      });
    }

    // Checks if text contains today's numeric date (e.g., "August 24" or "8/24" or "24th")
    function isBulletinFromToday(text) {
      const today = new Date();
      const monthName = today.toLocaleDateString('en-US', { month: 'long' }).toLowerCase();
      const monthShort = today.toLocaleDateString('en-US', { month: 'short' }).toLowerCase();
      const dayNum = today.getDate();
      const monthNum = today.getMonth() + 1;

      const textLower = text.toLowerCase();

      // Check for patterns like "August 24", "Aug 24", "8/24"
      const datePattern1 = new RegExp(`${monthName}\\s+0?${dayNum}\\b`);
      const datePattern2 = new RegExp(`${monthShort}\\s+0?${dayNum}\\b`);
      const datePattern3 = new RegExp(`\\b0?${monthNum}\/0?${dayNum}\\b`);

      return datePattern1.test(textLower) || datePattern2.test(textLower) || datePattern3.test(textLower);
    }

    function parseMenuText(text) {
      if (!text) return [];
      const meals = [];
      const mealRegex = /(Breakfast|Lunch|Dinner)\s+(?:on\s+)?(\w+)?\s+(?:will be|is)\s+(.+?)(?=(?:Breakfast|Lunch|Dinner)|$)/gi;
      
      let match;
      while ((match = mealRegex.exec(text)) !== null) {
        const mealType = match[1].trim();
        const dayRef = match[2] ? match[2].trim().toLowerCase() : 'today';
        let menuItems = match[3].trim();
        
        if (menuItems.endsWith('.')) menuItems = menuItems.slice(0, -1).trim();
        
        const items = menuItems
          .split(/\s+and\s+|\s*,\s*/)
          .map(item => item.trim())
          .filter(item => item.length > 0);
        
        meals.push({ mealType, dayRef, items });
      }
      return meals;
    }

    function displayStaleNotice() {
      const container = document.getElementById('menu-container');
      container.innerHTML = `
        <div class="stale-notice">
          The Daily Bulletin hasn't come out yet today.
          <div class="subtext">This screen will automatically update as soon as today's menu is posted.</div>
        </div>
      `;
    }

    async function fetchMenus() {
      try {
        const response = await fetch(sheetUrl);
        const csv = await response.text();
        
        const lines = csv.trim().split('\n');
        if (lines.length === 0) {
          displayStaleNotice();
          return;
        }

        const fullRawText = lines.join(' ').replace(/"/g, '');

        // If today's date isn't found anywhere in the bulletin row, treat it as unupdated
        if (!isBulletinFromToday(fullRawText)) {
          displayStaleNotice();
          updateLastUpdatedTime();
          return;
        }

        let menuText = lines[0];
        if (lines.length > 1 && (lines[0].toLowerCase().includes('menu') || lines[0].toLowerCase().includes('date'))) {
          menuText = lines[1];
        }
        
        parseAndRenderMenus(menuText.replace(/"/g, ''));
        updateLastUpdatedTime();
      } catch (error) {
        console.error("Error fetching menus:", error);
        displayStaleNotice();
      }
    }

    function parseAndRenderMenus(menuText) {
      const container = document.getElementById('menu-container');
      const meals = parseMenuText(menuText);

      const todayLunch = meals.find(m => m.mealType.toLowerCase() === 'lunch' && m.dayRef === 'today');
      const tomorrowBreakfast = meals.find(m => m.mealType.toLowerCase() === 'breakfast' && (m.dayRef === 'tomorrow' || m.dayRef !== 'today'));
      const tomorrowLunch = meals.find(m => m.mealType.toLowerCase() === 'lunch' && m.dayRef === 'tomorrow');

      container.innerHTML = `
        <div class="menu-grid">
          <div class="menu-card">
            <div class="menu-card-header">Today's Lunch</div>
            <div class="menu-card-date">${getTodayFormatted()}</div>
            <div class="menu-items">
              ${todayLunch ? renderMenuItems(todayLunch.items) : '<div class="no-menu">No menu listed</div>'}
            </div>
          </div>
          
          <div class="menu-card breakfast">
            <div class="menu-card-header">Tomorrow's Breakfast</div>
            <div class="menu-card-date">${getTomorrowFormatted()}</div>
            <div class="menu-items">
              ${tomorrowBreakfast ? renderMenuItems(tomorrowBreakfast.items) : '<div class="no-menu">No menu listed</div>'}
            </div>
          </div>
          
          <div class="menu-card">
            <div class="menu-card-header">Tomorrow's Lunch</div>
            <div class="menu-card-date">${getTomorrowFormatted()}</div>
            <div class="menu-items">
              ${tomorrowLunch ? renderMenuItems(tomorrowLunch.items) : '<div class="no-menu">No menu listed</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderMenuItems(items) {
      if (!items || items.length === 0) return '<div class="no-menu">No menu listed</div>';
      return items.map(item => `<div class="menu-item">${escapeHtml(item)}</div>`).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    fetchMenus();
    setInterval(fetchMenus, 15 * 60 * 1000);
  </script>
</body>
</html>
