<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Breakfast & Lunch</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 3rem;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo {
      height: 80px;
      width: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      flex: 1;
      align-items: stretch;
    }

    .menu-card {
      background-color: var(--patriots-red);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    .menu-card-header {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--patriots-white);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--patriots-white);
      padding-bottom: 1rem;
      flex-shrink: 0;
    }

    .menu-card-date {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 1rem;
      font-weight: 500;
      flex-shrink: 0;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      flex: 1;
    }

    .menu-item {
      font-size: 1.3rem;
      color: var(--patriots-white);
      line-height: 1.5;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .no-menu {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.8);
      border: 3px solid var(--patriots-white);
      border-radius: 12px;
      padding: 2rem;
      font-size: 1.5rem;
      color: var(--patriots-white);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-message {
      background-color: rgba(198, 12, 48, 0.8);
      border: 3px solid var(--patriots-white);
      border-radius: 12px;
      padding: 2rem;
      font-size: 1.5rem;
      color: var(--patriots-white);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Breakfast & Lunch</h1>
  </header>

  <div class="menu-wrapper" id="menu-container">
    <div class="loading-message">Loading menu...</div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Google Sheet configuration
    const sheetId = "1f2ydFePdNHRrWldHYpJQnYnMFP0zT_UlFN8WtzUMrt0";
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=menus`;

    // Get today's date formatted
    function getTodayFormatted() {
      const today = new Date();
      return today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    // Get tomorrow's date formatted
    function getTomorrowFormatted() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      return tomorrow.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    // Get day name (e.g., "Monday", "Tuesday")
    function getDayName(date) {
      const options = { weekday: 'long' };
      return date.toLocaleDateString('en-US', options);
    }

    // Get tomorrow's day name
    function getTomorrowDayName() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      return getDayName(tomorrow);
    }

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Parse menu text to extract meals
    // Looks for patterns like "Breakfast on Monday will be..." or "Lunch today will be..."
    function parseMenuText(text) {
      if (!text) return [];

      const meals = [];
      
      // Pattern to match: (Breakfast|Lunch|Dinner) (today|tomorrow|on [DayName]|) will be (.*)
      const mealRegex = /(Breakfast|Lunch|Dinner)\s+(?:on\s+)?(\w+)?\s+(?:will be|is)\s+(.+?)(?=(?:Breakfast|Lunch|Dinner)|$)/gi;
      
      let match;
      while ((match = mealRegex.exec(text)) !== null) {
        const mealType = match[1].trim();
        const dayRef = match[2] ? match[2].trim().toLowerCase() : 'today';
        let menuItems = match[3].trim();
        
        // Remove trailing period if present
        if (menuItems.endsWith('.')) {
          menuItems = menuItems.slice(0, -1).trim();
        }
        
        // Split menu items by "and" or comma
        const items = menuItems
          .split(/\s+and\s+|\s*,\s*/)
          .map(item => item.trim())
          .filter(item => item.length > 0);
        
        meals.push({
          mealType,
          dayRef,
          items
        });
      }
      
      return meals;
    }

    // Normalize day references to match our display days
    function normalizeDayRef(dayRef, tomorrowDayName) {
      dayRef = dayRef.toLowerCase();
      
      if (dayRef === 'today') {
        return 'today';
      } else if (dayRef === 'tomorrow') {
        return 'tomorrow';
      } else if (dayRef === tomorrowDayName.toLowerCase()) {
        return 'tomorrow';
      }
      
      return null; // Day not recognized
    }

    async function fetchMenus() {
      try {
        console.log("Fetching menus from Google Sheet...");
        const response = await fetch(sheetUrl);
        const csv = await response.text();
        
        console.log("Successfully fetched menu data");
        console.log("Raw CSV:", csv);
        
        // Split by newlines and get first data row
        const lines = csv.trim().split('\n');
        if (lines.length === 0) {
          displayError("No menu data found in sheet.");
          return;
        }
        
        // Get first data row (skip if it looks like a header)
        let menuText = lines[0];
        if (lines.length > 1 && (lines[0].toLowerCase().includes('menu') || lines[0].toLowerCase().includes('breakfast'))) {
          menuText = lines[1]; // Use second line if first is header
        }
        
        menuText = menuText.replace(/"/g, ''); // Remove quotes from CSV
        console.log("Menu text:", menuText);
        
        parseAndRenderMenus(menuText);
        updateLastUpdatedTime();
      } catch (error) {
        console.error("Error fetching menus:", error);
        displayError(`Unable to load menus. Check console for details.`);
      }
    }

    function displayError(message) {
      const container = document.getElementById('menu-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderMenus(menuText) {
      const container = document.getElementById('menu-container');
      
      // Parse the menu text
      const meals = parseMenuText(menuText);
      console.log("Parsed meals:", meals);

      if (meals.length === 0) {
        container.innerHTML = `
          <div class="menu-grid">
            <div class="menu-card">
              <div class="menu-card-header">Today's Lunch</div>
              <div class="menu-card-date">${getTodayFormatted()}</div>
              <div class="menu-items">
                <div class="no-menu">No menu available</div>
              </div>
            </div>
            <div class="menu-card">
              <div class="menu-card-header">Tomorrow's Breakfast</div>
              <div class="menu-card-date">${getTomorrowFormatted()}</div>
              <div class="menu-items">
                <div class="no-menu">No menu available</div>
              </div>
            </div>
            <div class="menu-card">
              <div class="menu-card-header">Tomorrow's Lunch</div>
              <div class="menu-card-date">${getTomorrowFormatted()}</div>
              <div class="menu-items">
                <div class="no-menu">No menu available</div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const tomorrowDayName = getTomorrowDayName();

      // Find relevant meals
      const todayLunch = meals.find(m => 
        m.mealType.toLowerCase() === 'lunch' && 
        normalizeDayRef(m.dayRef, tomorrowDayName) === 'today'
      );

      const tomorrowBreakfast = meals.find(m => 
        m.mealType.toLowerCase() === 'breakfast' && 
        normalizeDayRef(m.dayRef, tomorrowDayName) === 'tomorrow'
      );

      const tomorrowLunch = meals.find(m => 
        m.mealType.toLowerCase() === 'lunch' && 
        normalizeDayRef(m.dayRef, tomorrowDayName) === 'tomorrow'
      );

      // Render the menu grid
      container.innerHTML = `
        <div class="menu-grid">
          <div class="menu-card">
            <div class="menu-card-header">Today's Lunch</div>
            <div class="menu-card-date">${getTodayFormatted()}</div>
            <div class="menu-items">
              ${todayLunch ? renderMenuItems(todayLunch.items) : '<div class="no-menu">No menu available</div>'}
            </div>
          </div>
          
          <div class="menu-card">
            <div class="menu-card-header">Tomorrow's Breakfast</div>
            <div class="menu-card-date">${getTomorrowFormatted()}</div>
            <div class="menu-items">
              ${tomorrowBreakfast ? renderMenuItems(tomorrowBreakfast.items) : '<div class="no-menu">No menu available</div>'}
            </div>
          </div>
          
          <div class="menu-card">
            <div class="menu-card-header">Tomorrow's Lunch</div>
            <div class="menu-card-date">${getTomorrowFormatted()}</div>
            <div class="menu-items">
              ${tomorrowLunch ? renderMenuItems(tomorrowLunch.items) : '<div class="no-menu">No menu available</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderMenuItems(items) {
      if (!items || items.length === 0) {
        return '<div class="no-menu">No menu available</div>';
      }

      return items
        .map(item => `<div class="menu-item">${item}</div>`)
        .join('');
    }

    // Initial Fetch
    fetchMenus();

    // Auto-refresh every 15 minutes
    setInterval(fetchMenus, 15 * 60 * 1000);
  </script>
</body>
</html>
