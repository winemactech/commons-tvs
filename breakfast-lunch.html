<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Breakfast & Lunch</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
      --breakfast-blue: #1E5BA8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      padding: clamp(1.5rem, 3%, 3rem);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 4px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1rem, 2%, 2rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 10vw, 90px);
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: clamp(1rem, 3%, 2rem);
      flex: 1;
      align-items: stretch;
      min-height: 0;
    }

    .menu-card {
      background-color: var(--patriots-red);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1.2rem, 2%, 2rem);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    .menu-card.breakfast {
      background-color: var(--breakfast-blue);
      border-color: var(--breakfast-blue);
    }

    .menu-card-header {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 800;
      color: var(--patriots-white);
      margin-bottom: clamp(0.5rem, 1%, 1rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--patriots-white);
      padding-bottom: clamp(0.5rem, 1%, 1rem);
      flex-shrink: 0;
    }

    .menu-card-date {
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: clamp(0.75rem, 1.5%, 1.2rem);
      font-weight: 600;
      flex-shrink: 0;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: clamp(0.5rem, 1%, 0.8rem);
      flex: 1;
      min-height: 0;
    }

    .menu-item {
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      color: var(--patriots-white);
      line-height: 1.4;
      padding: clamp(0.3rem, 0.5%, 0.5rem) 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .no-menu {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.8);
      font-style: italic;
    }

    .loading-notice, .error-notice {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 8px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(2rem, 4vw, 4rem);
      font-size: clamp(1.3rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: var(--patriots-white);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    footer {
      margin-top: clamp(1rem, 2%, 1.5rem);
      padding-top: clamp(0.5rem, 1%, 0.75rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      opacity: 0.8;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Breakfast & Lunch</h1>
  </header>

  <div class="menu-wrapper" id="menu-container">
    <div class="loading-notice">Loading menu calendar...</div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    const menuCalendarIcalUrl = "https://calendar.google.com/calendar/ical/d9f286b4a71a789a16dab23a962221705c933dd934c53cfb6fbf6a67d4cd0a55%40group.calendar.google.com/public/basic.ics";

    const proxyUrls = [
      menuCalendarIcalUrl,
      `https://corsproxy.io/?${encodeURIComponent(menuCalendarIcalUrl)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(menuCalendarIcalUrl)}`
    ];

    function getFormattedDate(date) {
      return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function getNextSchoolDay(startDate) {
      const nextDay = new Date(startDate);
      nextDay.setDate(nextDay.getDate() + 1);
      
      if (nextDay.getDay() === 6) nextDay.setDate(nextDay.getDate() + 2);
      else if (nextDay.getDay() === 0) nextDay.setDate(nextDay.getDate() + 1);
      
      return nextDay;
    }

    function updateLastUpdatedTime() {
      const now = new Date();
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/Chicago'
      });
    }

    function parseICalDate(dateStr) {
      if (!dateStr) return null;
      dateStr = dateStr.trim();
      
      const match = dateStr.match(/^(\d{4})(\d{2})(\d{2})/);
      if (!match) return null;

      const [, year, month, day] = match;
      return new Date(year, month - 1, day);
    }

    function parseAndUnfoldICS(icsData) {
      return icsData.replace(/\r?\n[ \t]/g, '');
    }

    function extractLines(rawText) {
      if (!rawText) return [];
      // Clean iCal escape characters like \n, \,, \;
      const cleaned = rawText
        .replace(/\\n/gi, '\n')
        .replace(/\\,/g, ',')
        .replace(/\\;/g, ';');
      
      return cleaned
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);
    }

    async function fetchMenuCalendar() {
      for (let i = 0; i < proxyUrls.length; i++) {
        try {
          const response = await fetch(proxyUrls[i]);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.text();
          parseAndRenderCalendarMenu(data);
          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.error(`Proxy ${i + 1} failed:`, error);
          if (i === proxyUrls.length - 1) {
            displayError("Unable to load menu calendar. Please verify calendar public access settings.");
          }
        }
      }
    }

    function displayError(message) {
      const container = document.getElementById('menu-container');
      container.innerHTML = `<div class="error-notice">${message}</div>`;
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function parseAndRenderCalendarMenu(icsData) {
      const container = document.getElementById('menu-container');
      const unfoldedData = parseAndUnfoldICS(icsData);
      const blocks = unfoldedData.split('BEGIN:VEVENT');

      const today = new Date();
      const nextSchoolDay = getNextSchoolDay(today);

      const nextDayName = (today.getDay() === 5 || today.getDay() === 6) ? "Monday's" : "Tomorrow's";

      let todayLunchItems = [];
      let nextDayBreakfastItems = [];
      let nextDayLunchItems = [];

      blocks.slice(1).forEach(block => {
        const summaryMatch = block.match(/^SUMMARY:(.*)$/m);
        const dtstartMatch = block.match(/^DTSTART(?:;[^:]*)?:(.*)$/m);
        const descriptionMatch = block.match(/^DESCRIPTION:(.*)$/m);

        if (dtstartMatch) {
          const eventDate = parseICalDate(dtstartMatch[1].trim());
          if (!eventDate) return;

          const summary = summaryMatch ? summaryMatch[1].trim() : '';
          const description = descriptionMatch ? descriptionMatch[1].trim() : '';

          // Prefer DESCRIPTION for items; fall back to SUMMARY if DESCRIPTION is empty
          const contentToUse = description || summary;
          const parsedItems = extractLines(contentToUse);

          const fullText = (summary + " " + description).toLowerCase();

          if (isSameDate(eventDate, today)) {
            if (fullText.includes('lunch') || (!fullText.includes('breakfast') && !fullText.includes('dinner'))) {
              todayLunchItems.push(...parsedItems);
            }
          } else if (isSameDate(eventDate, nextSchoolDay)) {
            if (fullText.includes('breakfast')) {
              nextDayBreakfastItems.push(...parsedItems);
            } else if (fullText.includes('lunch') || (!fullText.includes('breakfast') && !fullText.includes('dinner'))) {
              nextDayLunchItems.push(...parsedItems);
            }
          }
        }
      });

      container.innerHTML = `
        <div class="menu-grid">
          <div class="menu-card">
            <div class="menu-card-header">Today's Lunch</div>
            <div class="menu-card-date">${getFormattedDate(today)}</div>
            <div class="menu-items">
              ${renderMenuItems(todayLunchItems)}
            </div>
          </div>
          
          <div class="menu-card breakfast">
            <div class="menu-card-header">${nextDayName} Breakfast</div>
            <div class="menu-card-date">${getFormattedDate(nextSchoolDay)}</div>
            <div class="menu-items">
              ${renderMenuItems(nextDayBreakfastItems)}
            </div>
          </div>
          
          <div class="menu-card">
            <div class="menu-card-header">${nextDayName} Lunch</div>
            <div class="menu-card-date">${getFormattedDate(nextSchoolDay)}</div>
            <div class="menu-items">
              ${renderMenuItems(nextDayLunchItems)}
            </div>
          </div>
        </div>
      `;
    }

    function renderMenuItems(items) {
      if (!items || items.length === 0) return '<div class="no-menu">No menu scheduled</div>';
      return items.map(item => `<div class="menu-item">${escapeHtml(item)}</div>`).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    fetchMenuCalendar();
    setInterval(fetchMenuCalendar, 15 * 60 * 1000);
  </script>
</body>
</html>
