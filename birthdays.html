<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Patriot Birthdays</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: clamp(1rem, 3%, 3rem);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1rem, 2%, 2rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 12vw, 100px);
      width: auto;
    }

    h1 {
      font-size: clamp(1.5rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .content-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: clamp(1.5rem, 3%, 3rem);
      overflow: hidden;
      min-height: 0;
    }

    /* LEFT SIDE - STUDENT BIRTHDAYS */
    .student-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .section-title {
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 700;
      color: var(--patriots-red);
      margin-bottom: clamp(0.5rem, 1%, 1rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .student-scroll-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: clamp(0.5rem, 1%, 0.8rem);
      padding-right: clamp(0.5rem, 1%, 1rem);
      min-height: 0;
    }

    .student-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-top: 1px solid rgba(176, 183, 188, 0.15);
      border-right: 1px solid rgba(176, 183, 188, 0.15);
      border-bottom: 1px solid rgba(176, 183, 188, 0.15);
      border-radius: 6px;
      padding: clamp(0.75rem, 1%, 1rem) clamp(1rem, 1.5%, 1.25rem);
      display: grid;
      grid-template-columns: 1.5fr 1fr 0.8fr;
      gap: clamp(0.75rem, 1.5%, 1.5rem);
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .student-name {
      font-size: clamp(1rem, 2vw, 1.1rem);
      font-weight: 600;
      color: var(--patriots-white);
    }

    .student-name.elanor-hanson {
      color: #E6D9F5;
    }

    .student-name.james-hanson {
      color: #D9F5E6;
    }

    .student-date {
      font-size: clamp(0.9rem, 1.8vw, 1rem);
      color: var(--patriots-silver);
      font-weight: 500;
      text-align: center;
    }

    .student-age {
      font-size: clamp(1rem, 2vw, 1.1rem);
      color: var(--patriots-red);
      font-weight: 700;
      text-align: center;
    }

    /* RIGHT SIDE - STAFF BIRTHDAYS */
    .staff-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .staff-cards-container {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      gap: clamp(1rem, 2%, 1.5rem);
      overflow: hidden;
      min-height: 0;
    }

    .staff-card {
      background-color: var(--patriots-red);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(0.75rem, 1.5%, 1.25rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      min-height: 0;
    }

    .staff-photo {
      width: clamp(50px, 12vw, 80px);
      height: clamp(50px, 12vw, 80px);
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--patriots-white);
      margin-bottom: clamp(0.4rem, 0.75%, 0.75rem);
      background-color: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .staff-name {
      font-size: clamp(1rem, 2.25vw, 1.2rem);
      font-weight: 700;
      color: var(--patriots-white);
      margin-bottom: clamp(0.2rem, 0.4%, 0.4rem);
      line-height: 1.2;
    }

    .staff-date {
      font-size: clamp(0.85rem, 1.8vw, 0.95rem);
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.2);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: clamp(1rem, 1.5%, 1.5rem);
      font-size: clamp(1rem, 2vw, 1.1rem);
      color: var(--patriots-white);
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: clamp(1rem, 1.5%, 1.5rem);
      font-size: clamp(1rem, 2vw, 1.1rem);
      color: var(--patriots-white);
    }

    /* Scrollbar styling */
    .student-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .student-scroll-container::-webkit-scrollbar-track {
      background: rgba(176, 183, 188, 0.1);
      border-radius: 3px;
    }

    .student-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(198, 12, 48, 0.5);
      border-radius: 3px;
    }

    .student-scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(198, 12, 48, 0.7);
    }

    footer {
      margin-top: clamp(1rem, 2%, 2rem);
      padding-top: clamp(0.5rem, 1%, 1rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      opacity: 0.7;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Patriot Birthdays</h1>
  </header>

  <div class="content-wrapper">
    <!-- LEFT SIDE - STUDENT BIRTHDAYS -->
    <div class="student-section">
      <h2 class="section-title">Student Birthdays</h2>
      <div class="student-scroll-container" id="student-container">
        <div class="loading-message">Loading student birthdays...</div>
      </div>
    </div>

    <!-- RIGHT SIDE - STAFF BIRTHDAYS -->
    <div class="staff-section">
      <h2 class="section-title">Staff Birthdays</h2>
      <div class="staff-cards-container" id="staff-container">
        <div class="loading-message">Loading staff birthdays...</div>
      </div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Google Sheets configuration - using CSV export
    const staffSheetId = "1pme-woefOEbcVNejh8QdfK3IW2QxsqZVllnTpPQDFVo";
    const staffSheetUrl = `https://docs.google.com/spreadsheets/d/${staffSheetId}/export?format=csv&gid=0`;
    
    const studentSheetId = "1wH7lhd_pg9jjdSwrOOZmeiFGT5lDqdJXZWhbbYPPsTI";
    const studentSheetUrl = `https://docs.google.com/spreadsheets/d/${studentSheetId}/export?format=csv&gid=0`;
    
    const githubImageBase = "https://raw.githubusercontent.com/winemactech/commons-tvs/main/images/staff/";

    // Special student name colors (Easter egg for dad!)
    const specialNameColors = {
      "Elanor Hanson": "elanor-hanson",   // light purple
      "James Hanson": "james-hanson"      // light green
    };

    let studentScrollInterval = null;
    let studentScrollDelay = null;

    // Generate GitHub image URL from staff name (lowercase)
    function generateGithubImageUrl(staffName) {
      if (!staffName) return '';
      
      // Convert "John Smith" to "john-smith.jpg" (lowercase)
      const formatted = staffName.trim().replace(/\s+/g, '-').toLowerCase() + '.JPG';
      return githubImageBase + formatted;
    }

    // Parse date string (MM/DD/YYYY or M/D/YYYY) to get MMDD and calculate age
    function parseDateString(dateStr) {
      if (!dateStr) return null;
      
      dateStr = dateStr.trim();
      const parts = dateStr.split('/');
      
      if (parts.length !== 3) return null;
      
      const month = parseInt(parts[0]);
      const day = parseInt(parts[1]);
      const year = parseInt(parts[2]);
      
      if (isNaN(month) || isNaN(day) || isNaN(year)) return null;
      
      // Return MMDD format and birth year
      const mmdd = String(month).padStart(2, '0') + String(day).padStart(2, '0');
      return { mmdd, year, month, day };
    }

    // Calculate age at next birthday
    function calculateAge(birthYear) {
      const currentYear = new Date().getFullYear();
      return currentYear - birthYear;
    }

    // Get today's date in MMDD format
    function getTodayMMDD() {
      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return month + day;
    }

    // Calculate days until birthday (accounting for year wrap)
    function daysUntilBirthday(mmdd) {
      const today = new Date();
      const currentYear = today.getFullYear();
      
      // Parse the birthday
      const month = parseInt(mmdd.substring(0, 2));
      const day = parseInt(mmdd.substring(2, 4));
      
      // Create birthday date for this year
      let birthdayDate = new Date(currentYear, month - 1, day);
      
      // If birthday has passed this year, use next year
      if (birthdayDate < today) {
        birthdayDate = new Date(currentYear + 1, month - 1, day);
      }
      
      // Calculate days difference
      const diffTime = birthdayDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    }

    // Format MMDD to display date
    function formatMMDDToDate(mmdd) {
      const month = mmdd.substring(0, 2);
      const day = mmdd.substring(2, 4);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${months[parseInt(month) - 1]} ${parseInt(day)}`;
    }

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Start auto-scroll for student birthdays
    function startStudentScroll() {
      const container = document.getElementById('student-container');
      
      if (studentScrollInterval) clearInterval(studentScrollInterval);
      if (studentScrollDelay) clearTimeout(studentScrollDelay);
      
      console.log("Starting student birthdays auto-scroll in 2 seconds...");
      
      studentScrollDelay = setTimeout(() => {
        console.log("Student birthdays auto-scroll initiated");
        studentScrollInterval = setInterval(() => {
          container.scrollTop += 1;
          
          if (container.scrollTop >= container.scrollHeight - container.clientHeight) {
            container.scrollTop = 0;
          }
        }, 50);
      }, 2000);
    }

    // Parse CSV data
    function parseCSV(csv) {
      const lines = csv.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const obj = {};
        const currentLine = lines[i].split(',');
        
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = (currentLine[j] || '').trim();
        }
        
        rows.push(obj);
      }
      
      return rows;
    }

    // Fetch and parse student birthdays
    async function fetchStudentBirthdays() {
      try {
        console.log("Fetching student birthdays from Google Sheet...");
        const response = await fetch(studentSheetUrl);
        const csv = await response.text();
        
        console.log("Successfully fetched student CSV data");
        const rows = parseCSV(csv);
        console.log("Parsed student rows:", rows);
        parseAndRenderStudentBirthdays(rows);
        return;
      } catch (error) {
        console.error("Error fetching student sheet:", error);
        displayStudentError(`Unable to load student birthdays. Check console for details.`);
      }
    }

    function displayStudentError(message) {
      const container = document.getElementById('student-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderStudentBirthdays(rows) {
      const container = document.getElementById('student-container');
      container.innerHTML = '';

      if (!rows || rows.length === 0) {
        container.innerHTML = '<div class="loading-message">Student birthdays spreadsheet is empty - checking again soon...</div>';
        startStudentScroll();
        return;
      }

      const birthdays = [];

      // Parse rows - use exact column names from sheet
      rows.forEach(row => {
        const name = row['Student Name'] || '';
        const birthDate = row['Student Birth Date'] || '';

        const cleanName = name.trim();
        const dateInfo = parseDateString(birthDate);

        if (!dateInfo) {
          console.log(`Skipping ${cleanName}: invalid birth date format (use MM/DD/YYYY)`);
          return;
        }

        const { mmdd, year } = dateInfo;
        const daysUntil = daysUntilBirthday(mmdd);
        const age = calculateAge(year);

        console.log(`Processing: ${cleanName}, DOB: ${birthDate}, Age turning: ${age}, Days until: ${daysUntil}`);

        // Include all upcoming birthdays
        if (daysUntil >= 0) {
          birthdays.push({
            name: cleanName,
            mmdd: mmdd,
            age: age,
            daysUntil
          });
        }
      });

      // Sort by days until birthday
      birthdays.sort((a, b) => a.daysUntil - b.daysUntil);

      console.log(`Found ${birthdays.length} upcoming student birthdays`);

      if (birthdays.length === 0) {
        container.innerHTML = '<div class="loading-message">No upcoming student birthdays - check back soon!</div>';
        startStudentScroll();
        return;
      }

      // Show all upcoming student birthdays
      birthdays.forEach(bd => {
        const card = document.createElement('div');
        card.className = 'student-card';
        const formattedDate = formatMMDDToDate(bd.mmdd);
        
        const nameElement = document.createElement('div');
        nameElement.className = 'student-name';
        
        // Check if this student has a special color
        const specialColorClass = specialNameColors[bd.name];
        if (specialColorClass) {
          nameElement.classList.add(specialColorClass);
        }
        
        nameElement.textContent = bd.name;
        
        const dateElement = document.createElement('div');
        dateElement.className = 'student-date';
        dateElement.textContent = formattedDate;
        
        const ageElement = document.createElement('div');
        ageElement.className = 'student-age';
        ageElement.textContent = bd.age;
        
        card.appendChild(nameElement);
        card.appendChild(dateElement);
        card.appendChild(ageElement);
        container.appendChild(card);
      });

      startStudentScroll();
      updateLastUpdatedTime();
    }

    // Fetch and parse staff birthdays
    async function fetchStaffBirthdays() {
      try {
        console.log("Fetching staff birthdays from Google Sheet...");
        const response = await fetch(staffSheetUrl);
        const csv = await response.text();
        
        console.log("Successfully fetched staff CSV data");
        const rows = parseCSV(csv);
        console.log("Parsed staff rows:", rows);
        parseAndRenderStaffBirthdays(rows);
        return;
      } catch (error) {
        console.error("Error fetching staff sheet:", error);
        displayStaffError(`Unable to load staff birthdays. Check console for details.`);
      }
    }

    function displayStaffError(message) {
      const container = document.getElementById('staff-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderStaffBirthdays(rows) {
      const container = document.getElementById('staff-container');
      container.innerHTML = '';

      if (!rows || rows.length === 0) {
        container.innerHTML = '<div class="error-message">Staff birthdays spreadsheet is empty.</div>';
        return;
      }

      const staffBirthdays = [];

      // Parse rows - use exact column names from sheet
      rows.forEach(row => {
        const name = row['Staff Name'] || '';
        const birthDate = row['Birthday'] || '';

        const cleanName = name.trim();
        const dateInfo = parseDateString(birthDate);

        if (!dateInfo) {
          console.log(`Skipping staff member ${cleanName}: invalid birth date format`);
          return;
        }

        const { mmdd, year } = dateInfo;
        const daysUntil = daysUntilBirthday(mmdd);
        const age = calculateAge(year);

        console.log(`Processing staff: ${cleanName}, DOB: ${birthDate}, Age turning: ${age}, Days until: ${daysUntil}`);

        if (daysUntil >= 0) {
          staffBirthdays.push({
            name: cleanName,
            mmdd: mmdd,
            age: age,
            daysUntil
          });
        }
      });

      // Sort by days until birthday
      staffBirthdays.sort((a, b) => a.daysUntil - b.daysUntil);

      console.log(`Found ${staffBirthdays.length} upcoming staff birthdays`);

      if (staffBirthdays.length === 0) {
        container.innerHTML = '<div class="error-message">No upcoming staff birthdays.</div>';
        return;
      }

      // Show up to 2 staff birthdays (the grid is 2 rows)
      const displayStaff = staffBirthdays.slice(0, 2);

      displayStaff.forEach(bd => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        
        const imageUrl = generateGithubImageUrl(bd.name);
        const photo = document.createElement('img');
        photo.className = 'staff-photo';
        photo.src = imageUrl;
        photo.alt = bd.name;
        photo.onerror = function() {
          this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="50" fill="%23B0B7BC"/%3E%3C/svg%3E';
        };
        
        const nameElement = document.createElement('div');
        nameElement.className = 'staff-name';
        nameElement.textContent = bd.name;
        
        const dateElement = document.createElement('div');
        dateElement.className = 'staff-date';
        dateElement.textContent = formatMMDDToDate(bd.mmdd);
        
        card.appendChild(photo);
        card.appendChild(nameElement);
        card.appendChild(dateElement);
        container.appendChild(card);
      });

      updateLastUpdatedTime();
    }

    // Initial Fetch
    fetchStudentBirthdays();
    fetchStaffBirthdays();

    // Auto-refresh every 15 minutes
    setInterval(() => {
      fetchStudentBirthdays();
      fetchStaffBirthdays();
    }, 15 * 60 * 1000);
  </script>
</body>
</html>
