<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Patriot Birthdays</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 3rem;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo {
      height: 80px;
      width: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .content-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      overflow: hidden;
    }

    /* LEFT SIDE - STUDENT BIRTHDAYS */
    .student-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--patriots-red);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .student-scroll-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding-right: 1rem;
      min-height: 0;
    }

    .student-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-top: 1px solid rgba(176, 183, 188, 0.15);
      border-right: 1px solid rgba(176, 183, 188, 0.15);
      border-bottom: 1px solid rgba(176, 183, 188, 0.15);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .student-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--patriots-white);
    }

    .student-date {
      font-size: 1rem;
      color: var(--patriots-silver);
      font-weight: 500;
    }

    /* RIGHT SIDE - STAFF BIRTHDAYS */
    .staff-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .staff-cards-container {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      gap: 1.5rem;
      overflow: hidden;
      min-height: 0;
    }

    .staff-card {
      background-color: var(--patriots-red);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      justify-content: center;
    }

    .staff-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--patriots-white);
      margin-bottom: 1rem;
      background-color: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .staff-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--patriots-white);
      margin-bottom: 0.5rem;
    }

    .staff-date {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.2);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: 1.5rem;
      font-size: 1.1rem;
      color: var(--patriots-white);
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: 1.5rem;
      font-size: 1.1rem;
      color: var(--patriots-white);
    }

    /* Scrollbar styling */
    .student-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .student-scroll-container::-webkit-scrollbar-track {
      background: rgba(176, 183, 188, 0.1);
      border-radius: 3px;
    }

    .student-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(198, 12, 48, 0.5);
      border-radius: 3px;
    }

    .student-scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(198, 12, 48, 0.7);
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Patriot Birthdays</h1>
  </header>

  <div class="content-wrapper">
    <!-- LEFT SIDE - STUDENT BIRTHDAYS -->
    <div class="student-section">
      <h2 class="section-title">Student Birthdays</h2>
      <div class="student-scroll-container" id="student-container">
        <div class="loading-message">Loading student birthdays...</div>
      </div>
    </div>

    <!-- RIGHT SIDE - STAFF BIRTHDAYS -->
    <div class="staff-section">
      <h2 class="section-title">Staff Birthdays</h2>
      <div class="staff-cards-container" id="staff-container">
        <div class="loading-message">Loading staff birthdays...</div>
      </div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Staff Google Calendar iCal Feed URL (public)
    const staffCalendarIcalUrl = "https://calendar.google.com/calendar/ical/c_70b03372ad6bd706e3f3f66c5e0488170f4047fb8e32e451417c632729c816b2%40group.calendar.google.com/public/basic.ics";
    
    // Google Drive folder ID for staff photos
    const driveFolder = "1P1JX7rLJ5OAesLEBvCFQQToPR4ZIBHpF";
    
    // Multiple CORS proxies for fetching the iCal feed
    const calendarProxyUrls = [
      `https://corsproxy.io/?${encodeURIComponent(staffCalendarIcalUrl)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(staffCalendarIcalUrl)}`,
      `https://cors-anywhere.herokuapp.com/${staffCalendarIcalUrl}`
    ];

    let studentScrollInterval = null;
    let studentScrollDelay = null;
    let fileCache = {}; // Cache for file IDs

    // Parse iCal date format
    function parseICalDate(dateStr) {
      if (!dateStr) return null;
      
      dateStr = dateStr.trim();
      
      if (dateStr.includes('T')) {
        const year = dateStr.substring(0, 4);
        const month = dateStr.substring(4, 6);
        const day = dateStr.substring(6, 8);
        const hour = dateStr.substring(9, 11);
        const minute = dateStr.substring(11, 13);
        return new Date(`${year}-${month}-${day}T${hour}:${minute}:00Z`);
      } else {
        const year = dateStr.substring(0, 4);
        const month = dateStr.substring(4, 6);
        const day = dateStr.substring(6, 8);
        return new Date(`${year}-${month}-${day}T00:00:00Z`);
      }
    }

    // Format date for display (e.g., "Aug 22")
    function formatDateShort(dateObj) {
      if (!dateObj) return "TBD";
      
      const options = {
        month: 'short',
        day: 'numeric',
        timeZone: 'America/Chicago'
      };
      
      return dateObj.toLocaleDateString('en-US', options);
    }

    // Convert name to filename format: "John Smith" -> "John-Smith.JPG"
    function nameToFilename(name) {
      return name.replace(/\s+/g, '-') + '.JPG';
    }

    // Build Google Drive image URL directly from filename
    function buildDriveImageUrl(filename) {
      // Use the folder structure: /folders/{folderId}?rlkey=...
      // Files can be accessed via: https://drive.google.com/thumbnail?id=FILE_ID
      // Or via direct share link if permissions allow
      // For now, we'll construct a working URL using Drive's public export
      return `https://drive.google.com/uc?export=view&id=file_search:${driveFolder}:${filename}`;
    }

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Start auto-scroll for student birthdays
    function startStudentScroll() {
      const container = document.getElementById('student-container');
      const scrollContainer = container.parentElement;
      
      if (studentScrollInterval) clearInterval(studentScrollInterval);
      if (studentScrollDelay) clearTimeout(studentScrollDelay);
      
      studentScrollDelay = setTimeout(() => {
        studentScrollInterval = setInterval(() => {
          scrollContainer.scrollTop += 1;
          
          if (scrollContainer.scrollTop >= container.scrollHeight - scrollContainer.clientHeight) {
            scrollContainer.scrollTop = 0;
          }
        }, 50);
      }, 2000);
    }

    // Fetch staff birthdays from Google Calendar with retry logic
    async function fetchStaffBirthdaysWithRetry() {
      for (let i = 0; i < calendarProxyUrls.length; i++) {
        try {
          console.log(`Attempting proxy ${i + 1}: ${calendarProxyUrls[i].substring(0, 50)}...`);
          const response = await fetch(calendarProxyUrls[i]);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.text();
          console.log("Successfully fetched calendar data");
          parseAndRenderStaffBirthdays(data);
          return;
        } catch (error) {
          console.error(`Proxy ${i + 1} failed:`, error);
          if (i === calendarProxyUrls.length - 1) {
            displayStaffError(`Unable to load staff birthdays. Make sure the calendar is set to Public in Google Calendar settings.`);
          }
        }
      }
    }

    function displayStaffError(message) {
      const container = document.getElementById('staff-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderStaffBirthdays(icsData) {
      const container = document.getElementById('staff-container');
      container.innerHTML = '';

      const birthdays = [];
      const blocks = icsData.split('BEGIN:VEVENT');

      blocks.slice(1).forEach(block => {
        const summaryMatch = block.match(/SUMMARY:(.*)/);
        const dtstartMatch = block.match(/DTSTART(?:;[^:]*)?:(.*)/);

        if (summaryMatch && dtstartMatch) {
          const title = summaryMatch[1].trim();
          const rawDate = dtstartMatch[1].trim();
          const dateObj = parseICalDate(rawDate);
          
          if (dateObj) {
            birthdays.push({
              name: title,
              dateObj,
              timestamp: dateObj.getTime()
            });
          }
        }
      });

      console.log(`Found ${birthdays.length} birthdays`);

      // Sort by date and get upcoming birthdays (next 30 days)
      const now = new Date();
      const thirtyDaysFromNow = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);
      
      const upcomingBirthdays = birthdays
        .filter(bd => bd.dateObj >= now && bd.dateObj <= thirtyDaysFromNow)
        .sort((a, b) => a.timestamp - b.timestamp)
        .slice(0, 2); // Show only 2 at a time

      console.log(`Found ${upcomingBirthdays.length} upcoming birthdays`);

      if (upcomingBirthdays.length === 0) {
        container.innerHTML = '<div class="error-message">No upcoming staff birthdays in the next 30 days.</div>';
        return;
      }

      // Render staff birthday cards
      upcomingBirthdays.forEach(bd => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        const formattedDate = formatDateShort(bd.dateObj);
        const filename = nameToFilename(bd.name);
        const imageUrl = buildDriveImageUrl(filename);
        
        card.innerHTML = `
          <img src="${imageUrl}" alt="${bd.name}" class="staff-photo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23C60C30%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22%3E🎂%3C/text%3E%3C/svg%3E'">
          <div class="staff-name">${bd.name}</div>
          <div class="staff-date">Birthday: ${formattedDate}</div>
        `;
        container.appendChild(card);
      });
    }

    // Placeholder for student birthdays (ready to connect later)
    function renderStudentBirthdaysPlaceholder() {
      const container = document.getElementById('student-container');
      container.innerHTML = `
        <div class="loading-message">Student birthdays placeholder - ready for connection</div>
      `;
      startStudentScroll();
    }

    // Initialize
    renderStudentBirthdaysPlaceholder();
    fetchStaffBirthdaysWithRetry();
    updateLastUpdatedTime();

    // Auto-refresh every 15 minutes
    setInterval(() => {
      fetchStaffBirthdaysWithRetry();
      updateLastUpdatedTime();
    }, 15 * 60 * 1000);
  </script>
</body>
</html>
