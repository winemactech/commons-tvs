<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Patriot Birthdays</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 3rem;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo {
      height: 80px;
      width: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .content-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      overflow: hidden;
    }

    /* LEFT SIDE - STUDENT BIRTHDAYS */
    .student-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--patriots-red);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .student-scroll-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding-right: 1rem;
      min-height: 0;
    }

    .student-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-top: 1px solid rgba(176, 183, 188, 0.15);
      border-right: 1px solid rgba(176, 183, 188, 0.15);
      border-bottom: 1px solid rgba(176, 183, 188, 0.15);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .student-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--patriots-white);
    }

    .student-date {
      font-size: 1rem;
      color: var(--patriots-silver);
      font-weight: 500;
    }

    /* RIGHT SIDE - STAFF BIRTHDAYS */
    .staff-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .staff-cards-container {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      gap: 1.5rem;
      overflow: hidden;
      min-height: 0;
    }

    .staff-card {
      background-color: var(--patriots-red);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      justify-content: center;
    }

    .staff-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--patriots-white);
      margin-bottom: 1rem;
      background-color: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .staff-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--patriots-white);
      margin-bottom: 0.5rem;
    }

    .staff-date {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.2);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: 1.5rem;
      font-size: 1.1rem;
      color: var(--patriots-white);
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 6px solid var(--patriots-red);
      border-radius: 6px;
      padding: 1.5rem;
      font-size: 1.1rem;
      color: var(--patriots-white);
    }

    /* Scrollbar styling */
    .student-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .student-scroll-container::-webkit-scrollbar-track {
      background: rgba(176, 183, 188, 0.1);
      border-radius: 3px;
    }

    .student-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(198, 12, 48, 0.5);
      border-radius: 3px;
    }

    .student-scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(198, 12, 48, 0.7);
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Patriot Birthdays</h1>
  </header>

  <div class="content-wrapper">
    <!-- LEFT SIDE - STUDENT BIRTHDAYS -->
    <div class="student-section">
      <h2 class="section-title">Student Birthdays</h2>
      <div class="student-scroll-container" id="student-container">
        <div class="loading-message">Loading student birthdays...</div>
      </div>
    </div>

    <!-- RIGHT SIDE - STAFF BIRTHDAYS -->
    <div class="staff-section">
      <h2 class="section-title">Staff Birthdays</h2>
      <div class="staff-cards-container" id="staff-container">
        <div class="loading-message">Loading staff birthdays...</div>
      </div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Google Sheets configuration - using CSV export
    const sheetId = "1pme-woefOEbcVNejh8QdfK3IW2QxsqZVllnTpPQDFVo";
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;
    const githubImageBase = "https://raw.githubusercontent.com/winemactech/commons-tvs/main/images/staff/";

    let studentScrollInterval = null;
    let studentScrollDelay = null;

    // Generate GitHub image URL from staff name
    function generateGithubImageUrl(staffName) {
      if (!staffName) return '';
      
      // Convert "John Smith" to "John-Smith.jpg"
      const formatted = staffName.trim().replace(/\s+/g, '-') + '.JPG';
      return githubImageBase + formatted;
    }

    // Convert Google Drive share links to direct image URLs (fallback)
    function convertGoogleDriveUrl(url) {
      if (!url) return '';
      
      // If it's a Google Drive URL, extract file ID
      const fileIdMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        const fileId = fileIdMatch[1];
        return `https://drive.google.com/uc?export=view&id=${fileId}`;
      }
      
      // If already in the correct format, return as-is
      if (url.includes('drive.google.com/uc?export=view')) {
        return url;
      }
      
      // Otherwise return the original URL
      return url;
    }

    // Get today's date in MMDD format
    function getTodayMMDD() {
      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return month + day;
    }

    // Calculate days until birthday (accounting for year wrap)
    function daysUntilBirthday(mmdd) {
      const today = new Date();
      const currentYear = today.getFullYear();
      
      // Parse the birthday
      const month = parseInt(mmdd.substring(0, 2));
      const day = parseInt(mmdd.substring(2, 4));
      
      // Create birthday date for this year
      let birthdayDate = new Date(currentYear, month - 1, day);
      
      // If birthday has passed this year, use next year
      if (birthdayDate < today) {
        birthdayDate = new Date(currentYear + 1, month - 1, day);
      }
      
      // Calculate days difference
      const diffTime = birthdayDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    }

    // Format MMDD to display date
    function formatMMDDToDate(mmdd) {
      const month = mmdd.substring(0, 2);
      const day = mmdd.substring(2, 4);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${months[parseInt(month) - 1]} ${parseInt(day)}`;
    }

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Start auto-scroll for student birthdays
    function startStudentScroll() {
      const container = document.getElementById('student-container');
      const scrollContainer = container.parentElement;
      
      if (studentScrollInterval) clearInterval(studentScrollInterval);
      if (studentScrollDelay) clearTimeout(studentScrollDelay);
      
      studentScrollDelay = setTimeout(() => {
        studentScrollInterval = setInterval(() => {
          scrollContainer.scrollTop += 1;
          
          if (scrollContainer.scrollTop >= container.scrollHeight - scrollContainer.clientHeight) {
            scrollContainer.scrollTop = 0;
          }
        }, 50);
      }, 2000);
    }

    // Parse CSV data
    function parseCSV(csv) {
      const lines = csv.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const obj = {};
        const currentLine = lines[i].split(',');
        
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = (currentLine[j] || '').trim();
        }
        
        rows.push(obj);
      }
      
      return rows;
    }

    // Fetch and parse Google Sheet data
    async function fetchStaffBirthdays() {
      try {
        console.log("Fetching Google Sheet data from CSV export...");
        const response = await fetch(sheetUrl);
        const csv = await response.text();
        
        console.log("Successfully fetched CSV data");
        const rows = parseCSV(csv);
        console.log("Parsed rows:", rows);
        parseAndRenderStaffBirthdays(rows);
        return;
      } catch (error) {
        console.error("Error fetching sheet:", error);
        displayStaffError(`Unable to load staff birthdays. Check console for details.`);
      }
    }

    function displayStaffError(message) {
      const container = document.getElementById('staff-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderStaffBirthdays(rows) {
      const container = document.getElementById('staff-container');
      container.innerHTML = '';

      if (!rows || rows.length === 0) {
        container.innerHTML = '<div class="error-message">No staff birthdays found in sheet.</div>';
        return;
      }

      const birthdays = [];

      // Parse rows - use exact column names from sheet
      rows.forEach(row => {
        const name = row['Staff Name'] || '';
        const mmdd = row['Staff Birthday'] || '';

        const cleanName = name.trim();
        const cleanMMDD = mmdd.trim();
        
        // Generate GitHub image URL from staff name
        const photoUrl = generateGithubImageUrl(cleanName);

        console.log(`Processing: ${cleanName}, ${cleanMMDD}, ${photoUrl}`);

        if (cleanName && cleanMMDD && cleanMMDD.length === 4 && /^\d{4}$/.test(cleanMMDD)) {
          const daysUntil = daysUntilBirthday(cleanMMDD);
          
          console.log(`${cleanName} birthday: ${cleanMMDD}, days until: ${daysUntil}`);
          
          // Only include birthdays in next 30 days
          if (daysUntil >= 0 && daysUntil <= 30) {
            birthdays.push({
              name: cleanName,
              mmdd: cleanMMDD,
              photoUrl: photoUrl,
              daysUntil
            });
          }
        }
      });

      // Sort by days until birthday
      birthdays.sort((a, b) => a.daysUntil - b.daysUntil);

      console.log(`Found ${birthdays.length} upcoming birthdays in next 30 days`);

      if (birthdays.length === 0) {
        container.innerHTML = '<div class="error-message">No upcoming staff birthdays in the next 30 days.</div>';
        return;
      }

      // Show only first 2 birthdays
      birthdays.slice(0, 2).forEach(bd => {
        const card = document.createElement('div');
        card.className = 'staff-card';
        const formattedDate = formatMMDDToDate(bd.mmdd);
        
        card.innerHTML = `
          <img src="${bd.photoUrl}" alt="${bd.name}" class="staff-photo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23C60C30%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22%3E🎂%3C/text%3E%3C/svg%3E'">
          <div class="staff-name">${bd.name}</div>
          <div class="staff-date">Birthday: ${formattedDate}</div>
        `;
        container.appendChild(card);
      });
    }

    // Placeholder for student birthdays (ready to connect later)
    function renderStudentBirthdaysPlaceholder() {
      const container = document.getElementById('student-container');
      container.innerHTML = `
        <div class="loading-message">Student birthdays placeholder - ready for connection</div>
      `;
      startStudentScroll();
    }

    // Initialize
    renderStudentBirthdaysPlaceholder();
    fetchStaffBirthdays();
    updateLastUpdatedTime();

    // Auto-refresh every 15 minutes
    setInterval(() => {
      fetchStaffBirthdays();
      updateLastUpdatedTime();
    }, 15 * 60 * 1000);
  </script>
</body>
</html>
