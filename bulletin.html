<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Daily Bulletin</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 2rem 3rem;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo {
      height: 80px;
      width: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulletin-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      justify-content: center;
      align-items: center;
    }

    .slides-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .announcement-slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      text-align: center;
      background: linear-gradient(135deg, rgba(0, 34, 68, 0.95) 0%, rgba(0, 34, 68, 0.98) 100%);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    .announcement-slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    .announcement-slide.prev {
      opacity: 0;
      z-index: 5;
    }

    .slide-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      gap: 2rem;
    }

    .announcement-text {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--patriots-white);
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 90%;
    }

    .slide-counter {
      font-size: 1.2rem;
      color: var(--patriots-silver);
      font-weight: 500;
      margin-top: 2rem;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.3);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 3rem;
      font-size: 2rem;
      color: var(--patriots-white);
      text-align: center;
      max-width: 80%;
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 3rem;
      font-size: 2rem;
      color: var(--patriots-white);
      text-align: center;
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: 0.9rem;
      opacity: 0.7;
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Daily Bulletin</h1>
  </header>

  <div class="bulletin-wrapper" id="bulletin-container">
    <div class="slides-container" id="slides-container">
      <div class="loading-message">Loading announcements...</div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Google Doc ID (extracted from the shared link)
    const docId = "1Lrj6TPuvSLBHuDT9iPpx-pJtRy0GYRJxda5IFgRMYfI";
    
    // Google Docs export URL (as plain text)
    const googleDocUrl = `https://docs.google.com/document/d/${docId}/export?format=txt`;
    
    // Try multiple CORS proxies in order
    const proxyUrls = [
      `https://corsproxy.io/?${encodeURIComponent(googleDocUrl)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(googleDocUrl)}`,
      `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(googleDocUrl)}`
    ];

    let currentSlide = 0;
    let slides = [];
    let slideInterval = null;
    let currentProxyIndex = 0;

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Show a specific slide
    function showSlide(index) {
      if (slides.length === 0) return;
      
      // Remove active class from all slides
      document.querySelectorAll('.announcement-slide').forEach(slide => {
        slide.classList.remove('active', 'prev');
      });
      
      // Add active class to current slide
      currentSlide = index % slides.length;
      if (slides[currentSlide]) {
        slides[currentSlide].classList.add('active');
      }
    }

    // Auto-advance slides
    function startSlideshow() {
      if (slideInterval) clearInterval(slideInterval);
      
      slideInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
      }, 2000); // Change slide every 2 seconds
    }

    async function fetchAndDisplayBulletinWithRetry() {
      for (let i = 0; i < proxyUrls.length; i++) {
        try {
          console.log(`Attempting to fetch with proxy ${i + 1}/${proxyUrls.length}...`);
          const response = await fetch(proxyUrls[i], {
            method: 'GET',
            timeout: 10000
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const text = await response.text();
          console.log("Successfully fetched bulletin");
          currentProxyIndex = i;
          parseAndRenderBulletin(text);
          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.error(`Proxy ${i + 1} failed:`, error.message);
          if (i === proxyUrls.length - 1) {
            displayError(`Unable to load bulletin. Please verify the Google Doc is set to "Public" sharing.`);
          }
        }
      }
    }

    function displayError(message) {
      const container = document.getElementById('slides-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderBulletin(docText) {
      const container = document.getElementById('slides-container');
      container.innerHTML = '';
      slides = [];

      // Normalize line endings: replace \r\n with \n, then split by double newlines
      const normalizedText = docText.replace(/\r\n/g, '\n');
      const announcements = normalizedText
        .split(/\n\n+/)
        .map(announcement => announcement.trim())
        .filter(announcement => announcement.length > 0);

      console.log(`Found ${announcements.length} announcements`);
      console.log("Announcements:", announcements);

      if (announcements.length === 0) {
        displayError('No announcements found in the bulletin.');
        return;
      }

      // Create slide for each announcement
      announcements.forEach((announcement, index) => {
        const slide = document.createElement('div');
        slide.className = 'announcement-slide';
        if (index === 0) slide.classList.add('active');
        
        const slideContent = document.createElement('div');
        slideContent.className = 'slide-content';
        
        const announcementText = document.createElement('div');
        announcementText.className = 'announcement-text';
        announcementText.textContent = announcement;
        
        const counter = document.createElement('div');
        counter.className = 'slide-counter';
        counter.textContent = `${index + 1} of ${announcements.length}`;
        
        slideContent.appendChild(announcementText);
        slideContent.appendChild(counter);
        slide.appendChild(slideContent);
        container.appendChild(slide);
        
        slides.push(slide);
      });

      // Start the slideshow
      startSlideshow();
    }

    // Initial Fetch
    fetchAndDisplayBulletinWithRetry();

    // Auto-refresh every 5 minutes
    setInterval(fetchAndDisplayBulletinWithRetry, 5 * 60 * 1000);
  </script>
</body>
</html>
