<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Daily Bulletin</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: clamp(1rem, 3%, 3rem);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1rem, 2%, 2rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 12vw, 100px);
      width: auto;
    }

    h1 {
      font-size: clamp(1.5rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulletin-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    .slides-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .announcement-slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(1.5rem, 3%, 3rem);
      text-align: center;
      background: linear-gradient(135deg, rgba(0, 34, 68, 0.95) 0%, rgba(0, 34, 68, 0.98) 100%);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    .announcement-slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    .announcement-slide.prev {
      opacity: 0;
      z-index: 5;
    }

    .slide-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      gap: clamp(1rem, 2%, 2rem);
    }

    .announcement-text {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--patriots-white);
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 90%;
    }

    .slide-counter {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: var(--patriots-silver);
      font-weight: 500;
      margin-top: clamp(1rem, 2%, 2rem);
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.3);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1.5rem, 3%, 3rem);
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: var(--patriots-white);
      text-align: center;
      max-width: 80%;
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1.5rem, 3%, 3rem);
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: var(--patriots-white);
      text-align: center;
    }

    footer {
      margin-top: clamp(1rem, 2%, 2rem);
      padding-top: clamp(0.5rem, 1%, 1rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      opacity: 0.7;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Daily Bulletin</h1>
  </header>

  <div class="bulletin-wrapper" id="bulletin-container">
    <div class="slides-container" id="slides-container">
      <div class="loading-message">Loading announcements...</div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Google Sheet ID and range (pulls from column A)
    const sheetId = "1f2ydFePdNHRrWldHYpJQnYnMFP0zT_UlFN8WtzUMrt0";
    const sheetRange = "A:A"; // Column A contains announcements
    
    // Google Sheets API export URL (CSV format for easy parsing)
    const googleSheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0&range=${encodeURIComponent(sheetRange)}`;

    let currentSlide = 0;
    let slides = [];
    let slideInterval = null;

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Show a specific slide
    function showSlide(index) {
      if (slides.length === 0) return;
      
      // Remove active class from all slides
      document.querySelectorAll('.announcement-slide').forEach(slide => {
        slide.classList.remove('active', 'prev');
      });
      
      // Add active class to current slide
      currentSlide = index % slides.length;
      if (slides[currentSlide]) {
        slides[currentSlide].classList.add('active');
      }
    }

    // Auto-advance slides
    function startSlideshow() {
      if (slideInterval) clearInterval(slideInterval);
      
      slideInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
      }, 5000); // Change slide every 5 seconds
    }

    async function fetchAndDisplayBulletin() {
      try {
        console.log("Fetching announcements from Google Sheet...");
        
        // Use fetch to get CSV directly from Google Sheets
        const response = await fetch(googleSheetUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const csv = await response.text();
        console.log("Successfully fetched sheet");
        parseAndRenderBulletin(csv);
        updateLastUpdatedTime();
      } catch (error) {
        console.error("Error loading bulletin:", error);
        displayError(`Unable to load bulletin. Please verify the Google Sheet is set to "Public" sharing.`);
      }
    }

    function displayError(message) {
      const container = document.getElementById('slides-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseCSVLine(line) {
      // Properly handle CSV parsing with quoted fields
      if (line.startsWith('"') && line.endsWith('"')) {
        // Remove outer quotes and unescape inner quotes (CSV uses "" for escaped quotes)
        return line.slice(1, -1).replace(/""/g, '"');
      }
      return line;
    }

    function parseAndRenderBulletin(csvText) {
      const container = document.getElementById('slides-container');
      container.innerHTML = '';
      slides = [];

      // Parse CSV: split by newlines
      const lines = csvText.trim().split('\n');
      const announcements = lines
        .map(line => parseCSVLine(line.trim()))
        .filter(line => line.length > 0); // Remove empty lines

      console.log(`Found ${announcements.length} announcements`);
      console.log("Announcements:", announcements);

      if (announcements.length === 0) {
        displayError('No announcements found in the bulletin.');
        return;
      }

      // Create slide for each announcement
      announcements.forEach((announcement, index) => {
        const slide = document.createElement('div');
        slide.className = 'announcement-slide';
        if (index === 0) slide.classList.add('active');
        
        const slideContent = document.createElement('div');
        slideContent.className = 'slide-content';
        
        const announcementText = document.createElement('div');
        announcementText.className = 'announcement-text';
        announcementText.textContent = announcement;
        
        const counter = document.createElement('div');
        counter.className = 'slide-counter';
        counter.textContent = `${index + 1} of ${announcements.length}`;
        
        slideContent.appendChild(announcementText);
        slideContent.appendChild(counter);
        slide.appendChild(slideContent);
        container.appendChild(slide);
        
        slides.push(slide);
      });

      // Start the slideshow
      startSlideshow();
    }

    // Initial Fetch
    fetchAndDisplayBulletin();

    // Auto-refresh every 5 minutes
    setInterval(fetchAndDisplayBulletin, 5 * 60 * 1000);
  </script>
</body>
</html>
