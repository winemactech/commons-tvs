<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Daily Bulletin</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: clamp(1rem, 3%, 3rem);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 3px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1rem, 2%, 2rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 12vw, 100px);
      width: auto;
    }

    h1 {
      font-size: clamp(1.5rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulletin-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .bulletin-scroll-container {
      display: flex;
      flex-direction: column;
      gap: clamp(0.75rem, 1.5%, 1rem);
      padding-right: clamp(0.5rem, 1%, 1rem);
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .bulletin-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 8px;
      padding: clamp(1.5rem, 3%, 2.5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      min-height: 200px;
    }

    .bulletin-text {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      line-height: 1.4;
      color: var(--patriots-white);
      letter-spacing: 0.5px;
    }

    .bulletin-counter {
      margin-top: clamp(1rem, 2%, 2rem);
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: var(--patriots-silver);
      font-weight: 500;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.2);
      border: 3px solid var(--patriots-red);
      border-radius: 8px;
      padding: clamp(1.5rem, 3%, 2.5rem);
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--patriots-white);
      text-align: center;
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 8px;
      padding: clamp(1.5rem, 3%, 2.5rem);
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--patriots-white);
      text-align: center;
    }

    /* Scrollbar styling */
    .bulletin-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .bulletin-scroll-container::-webkit-scrollbar-track {
      background: rgba(176, 183, 188, 0.1);
      border-radius: 3px;
    }

    .bulletin-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(198, 12, 48, 0.5);
      border-radius: 3px;
    }

    .bulletin-scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(198, 12, 48, 0.7);
    }

    footer {
      margin-top: clamp(1rem, 2%, 2rem);
      padding-top: clamp(0.5rem, 1%, 1rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      opacity: 0.7;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Daily Bulletin</h1>
  </header>

  <div class="bulletin-wrapper" id="bulletin-container">
    <div class="bulletin-scroll-container" id="bulletin-scroll-container">
      <div class="loading-message">Loading bulletin...</div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Google Sheet CSV export URL
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1f2ydFePdNHRrWldHYpJQnYnMFP0zT_UlFN8WtzUMrt0/export?format=csv&gid=0";

    // CORS proxies
    const proxyUrls = [
      `https://corsproxy.io/?${encodeURIComponent(sheetUrl)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(sheetUrl)}`
    ];

    let scrollInterval = null;
    let scrollDelay = null;

    // Update last updated timestamp
    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    // Start auto-scroll
    function startAutoScroll() {
      const scrollContainer = document.getElementById('bulletin-scroll-container');
      
      // Clear any existing scroll intervals
      if (scrollInterval) clearInterval(scrollInterval);
      if (scrollDelay) clearTimeout(scrollDelay);
      
      // Wait 2 seconds before starting scroll
      scrollDelay = setTimeout(() => {
        console.log("Starting bulletin auto-scroll...");
        scrollInterval = setInterval(() => {
          scrollContainer.scrollTop += 1;
          
          // If we've scrolled to the bottom, reset to top
          if (scrollContainer.scrollTop >= scrollContainer.scrollHeight - scrollContainer.clientHeight) {
            scrollContainer.scrollTop = 0;
          }
        }, 50);
      }, 2000);
    }

    // Fetch bulletin with retry logic
    async function fetchBulletinWithRetry() {
      for (let i = 0; i < proxyUrls.length; i++) {
        try {
          console.log(`Attempting to fetch bulletin from proxy ${i + 1}...`);
          const response = await fetch(proxyUrls[i], { 
            method: 'GET',
            timeout: 10000
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const csv = await response.text();
          console.log("Successfully fetched bulletin data");
          parseAndRenderBulletin(csv);
          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.error(`Proxy ${i + 1} failed:`, error);
          if (i === proxyUrls.length - 1) {
            displayError(`Unable to load bulletin from Google Sheet. Please try refreshing the page.`);
          }
        }
      }
    }

    function displayError(message) {
      const container = document.getElementById('bulletin-scroll-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseAndRenderBulletin(csv) {
      const container = document.getElementById('bulletin-scroll-container');
      container.innerHTML = '';

      // Parse CSV: split by newlines and filter empty lines
      const lines = csv.trim().split('\n');
      const bulletins = lines
        .map(line => line.trim())
        .filter(line => line.length > 0 && line !== '""');

      console.log(`Found ${bulletins.length} bulletins`);

      if (bulletins.length === 0) {
        displayError('No bulletins found in the sheet.');
        return;
      }

      // Create card for each bulletin
      bulletins.forEach((text, index) => {
        const card = document.createElement('div');
        card.className = 'bulletin-card';
        
        const textDiv = document.createElement('div');
        textDiv.className = 'bulletin-text';
        
        // Remove quotes if present
        let cleanText = text;
        if (cleanText.startsWith('"') && cleanText.endsWith('"')) {
          cleanText = cleanText.slice(1, -1).replace(/""/g, '"');
        }
        
        textDiv.textContent = cleanText;
        card.appendChild(textDiv);
        
        // Add counter if more than one item
        if (bulletins.length > 1) {
          const counter = document.createElement('div');
          counter.className = 'bulletin-counter';
          counter.textContent = `${index + 1} of ${bulletins.length}`;
          card.appendChild(counter);
        }
        
        container.appendChild(card);
      });

      startAutoScroll();
    }

    // Fetch bulletin on page load
    window.addEventListener('load', () => {
      fetchBulletinWithRetry();
      // Refresh every 5 minutes
      setInterval(fetchBulletinWithRetry, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
