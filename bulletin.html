<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Daily Bulletin</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      border-bottom: 4px solid var(--patriots-red);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
    }

    .logo {
      height: 70px;
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulletin-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0; /* Prevents flex collapse */
    }

    .slides-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .announcement-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 2rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 3px solid var(--patriots-red);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
    }

    .announcement-slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    .slide-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }

    .announcement-text {
      font-size: clamp(1.8rem, 4.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.35;
      color: var(--patriots-white);
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 92%;
    }

    .slide-counter {
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      color: var(--patriots-silver);
      font-weight: 600;
      background: rgba(0, 34, 68, 0.8);
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      border: 1px solid var(--patriots-silver);
      margin-top: 1rem;
      flex-shrink: 0;
    }

    .error-message, .loading-message {
      background-color: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--patriots-red);
      border-radius: 12px;
      padding: 2rem 3rem;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      color: var(--patriots-white);
      text-align: center;
    }

    .error-message {
      background-color: rgba(198, 12, 48, 0.2);
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      opacity: 0.8;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Daily Bulletin</h1>
  </header>

  <div class="bulletin-wrapper">
    <div class="slides-container" id="slides-container">
      <div class="loading-message">Loading announcements...</div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    // Direct Google Sheets CSV Export Endpoints
    const sheetId = "1f2ydFePdNHRrWldHYpJQnYnMFP0zT_UlFN8WtzUMrt0";
    
    // We try direct fetch first, followed by fallback export formats
    const fetchEndpoints = [
      `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Sheet1`,
      `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`)}`
    ];

    let currentSlide = 0;
    let slides = [];
    let slideInterval = null;

    function updateLastUpdatedTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'America/Chicago'
      };
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', options);
    }

    function showSlide(index) {
      if (slides.length === 0) return;
      slides.forEach(slide => slide.classList.remove('active'));
      
      currentSlide = index % slides.length;
      if (slides[currentSlide]) {
        slides[currentSlide].classList.add('active');
      }
    }

    function startSlideshow() {
      if (slideInterval) clearInterval(slideInterval);
      if (slides.length <= 1) return;
      
      slideInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
      }, 6000); // 6 seconds per slide
    }

    async function fetchBulletinWithRetry() {
      for (let i = 0; i < fetchEndpoints.length; i++) {
        try {
          console.log(`Trying endpoint ${i + 1}...`);
          const response = await fetch(fetchEndpoints[i], { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          
          const csv = await response.text();
          if (!csv || csv.includes("<!DOCTYPE html>")) {
            throw new Error("Received HTML login page instead of CSV data.");
          }
          
          parseAndRenderBulletin(csv);
          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.error(`Endpoint ${i + 1} failed:`, error);
          if (i === fetchEndpoints.length - 1) {
            displayError(`Unable to load bulletin from Google Sheet. Make sure the sheet sharing is set to "Anyone with the link can view".`);
          }
        }
      }
    }

    function displayError(message) {
      const container = document.getElementById('slides-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    function parseCSV(text) {
      const lines = [];
      let entry = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (entry.trim()) lines.push(cleanEntry(entry));
          entry = '';
        } else {
          entry += c;
        }
      }
      if (entry.trim()) lines.push(cleanEntry(entry));
      return lines;
    }

    function cleanEntry(raw) {
      let trimmed = raw.trim();
      if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
        trimmed = trimmed.slice(1, -1);
      }
      return trimmed.replace(/""/g, '"').trim();
    }

    function parseAndRenderBulletin(csvText) {
      const container = document.getElementById('slides-container');
      container.innerHTML = '';
      slides = [];

      const announcements = parseCSV(csvText);

      // Filter out header row if present
      const filteredAnnouncements = announcements.filter(item => 
        item.toLowerCase() !== "announcements" && item.toLowerCase() !== "bulletin"
      );

      if (filteredAnnouncements.length === 0) {
        displayError('No announcements found in the bulletin.');
        return;
      }

      filteredAnnouncements.forEach((announcement, index) => {
        const slide = document.createElement('div');
        slide.className = 'announcement-slide';
        if (index === 0) slide.classList.add('active');
        
        slide.innerHTML = `
          <div class="slide-body">
            <div class="announcement-text">${escapeHtml(announcement)}</div>
          </div>
          <div class="slide-counter">${index + 1} of ${filteredAnnouncements.length}</div>
        `;
        
        container.appendChild(slide);
        slides.push(slide);
      });

      startSlideshow();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial Load & Auto-refresh every 5 minutes
    fetchBulletinWithRetry();
    setInterval(fetchBulletinWithRetry, 5 * 60 * 1000);
  </script>
</body>
</html>
