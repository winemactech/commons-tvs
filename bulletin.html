<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Daily Bulletin</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      padding: clamp(1.5rem, 3vh, 3rem);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2vw, 2rem);
      border-bottom: 4px solid var(--patriots-red);
      padding-bottom: clamp(0.5rem, 1.5vh, 1.25rem);
      margin-bottom: clamp(1rem, 2vh, 1.5rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 8vh, 90px);
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(2rem, 4.5vh, 3.5rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulletin-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .bulletin-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 10px solid var(--patriots-red);
      border-radius: 16px;
      padding: clamp(1.25rem, 2.5vh, 2rem) clamp(1.5rem, 3vw, 3rem);
      flex: 1;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .bulletin-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(0.75rem, 1.5vh, 1.25rem);
      border-bottom: 2px solid rgba(176, 183, 188, 0.25);
      padding-bottom: clamp(0.5rem, 1vh, 0.75rem);
      flex-shrink: 0;
    }

    .bulletin-date {
      font-size: clamp(1.4rem, 2.8vh, 2.2rem);
      font-weight: 800;
      color: var(--patriots-silver);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-counter {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--patriots-silver);
      color: var(--patriots-white);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-size: clamp(1.1rem, 2.2vh, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .content-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .bulletin-content {
      width: 100%;
      text-align: center;
      line-height: 1.12;
      font-weight: 800;
      color: var(--patriots-white);
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 1;
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
      transform: translateY(0);
    }

    .bulletin-content.fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }

    .pending-notice, .error-notice {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 10px solid var(--patriots-silver);
      border-radius: 16px;
      padding: 3rem;
      font-size: clamp(2rem, 5vh, 3.5rem);
      font-weight: 700;
      color: var(--patriots-white);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .pending-subtitle {
      font-size: clamp(1.2rem, 2.5vh, 1.8rem);
      font-weight: 400;
      color: var(--patriots-silver);
      margin-top: 1.5rem;
    }

    footer {
      margin-top: clamp(1rem, 2vh, 1.5rem);
      padding-top: clamp(0.5rem, 1vh, 0.75rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.9rem, 1.5vh, 1.1rem);
      opacity: 0.8;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Daily Bulletin</h1>
  </header>

  <div class="bulletin-wrapper" id="bulletin-container">
    <div class="pending-notice">
      Checking for today's bulletin...
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuH1BgocMX1hFpZ2PKK8Hjn4o_-AvtfGTMY1t6sdMWsGmFvCv8tQjOQu29-bgkAyLpL3uTtaNnmpVj/pub?gid=0&single=true&output=csv";

    const fetchEndpoints = [
      sheetCsvUrl,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(sheetCsvUrl)}`,
      `https://corsproxy.io/?${encodeURIComponent(sheetCsvUrl)}`
    ];

    let itemsList = [];
    let currentIndex = 0;
    let rotationTimer = null;
    let formattedDateString = '';
    let globalFontSize = 48; // Stores uniform font size for all slides

    function updateLastUpdatedTime() {
      const now = new Date();
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/Chicago'
      });
    }

    function isToday(dateString) {
      if (!dateString) return false;
      const cleanDate = dateString.trim().replace(/^"|"$/g, '');
      const parsedDate = new Date(cleanDate);
      if (isNaN(parsedDate.getTime())) return false;

      const today = new Date();
      return parsedDate.getFullYear() === today.getFullYear() &&
             parsedDate.getMonth() === today.getMonth() &&
             parsedDate.getDate() === today.getDate();
    }

    function parseCSV(csvText) {
      const lines = [];
      let currentRow = [];
      let currentToken = '';
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentToken += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentToken.trim());
          if (currentRow.length > 0) lines.push(currentRow);
          currentRow = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      if (currentToken || currentRow.length > 0) {
        currentRow.push(currentToken.trim());
        lines.push(currentRow);
      }
      return lines;
    }

    async function fetchBulletin() {
      for (let endpoint of fetchEndpoints) {
        try {
          const response = await fetch(endpoint);
          if (!response.ok) throw new Error(`HTTP Status ${response.status}`);
          
          const rawCsv = await response.text();
          const parsedRows = parseCSV(rawCsv);

          const sheetDateStr = (parsedRows[0] && parsedRows[0][0]) ? parsedRows[0][0] : '';

          if (isToday(sheetDateStr)) {
            const cleanDate = sheetDateStr.trim().replace(/^"|"$/g, '');
            formattedDateString = new Date(cleanDate).toLocaleDateString('en-US', {
              weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });

            const extractedItems = [];
            for (let row of parsedRows) {
              if (row[1] && row[1].trim().length > 0) {
                extractedItems.push(row[1].trim());
              }
            }

            if (JSON.stringify(extractedItems) !== JSON.stringify(itemsList)) {
              itemsList = extractedItems;
              currentIndex = 0;
              setupCardStructure();
              calculateGlobalFontSize();
              startRotation();
            }
          } else {
            stopRotation();
            renderPendingNotice();
          }

          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.warn("Fetch attempt failed, trying fallback...", error);
        }
      }

      stopRotation();
      displayError("Unable to load daily bulletin. Please check your Google Sheet publish settings.");
    }

    function setupCardStructure() {
      const container = document.getElementById('bulletin-container');
      container.innerHTML = `
        <div class="bulletin-card">
          <div class="bulletin-header-row">
            <div class="bulletin-date">${formattedDateString}</div>
            <div class="slide-counter" id="slide-counter">1 of ${itemsList.length}</div>
          </div>
          <div class="content-viewport" id="viewport">
            <div class="bulletin-content" id="bulletin-text"></div>
          </div>
        </div>
      `;
    }

    // Calculates the ideal font size for the LONGEST announcement, then locks it for all items
    function calculateGlobalFontSize() {
      const textEl = document.getElementById('bulletin-text');
      const viewportEl = document.getElementById('viewport');
      if (!textEl || !viewportEl || itemsList.length === 0) return;

      const maxHeight = viewportEl.clientHeight;
      const maxWidth = viewportEl.clientWidth;

      let smallestFitSize = 110;

      // Find the best fit for EACH slide, keeping the minimum calculated value overall
      itemsList.forEach(text => {
        textEl.textContent = text;
        
        let minSize = 28;
        let maxSize = 110;
        let optimalSize = minSize;

        while (minSize <= maxSize) {
          let mid = Math.floor((minSize + maxSize) / 2);
          textEl.style.fontSize = mid + 'px';

          if (textEl.scrollHeight <= maxHeight && textEl.scrollWidth <= maxWidth) {
            optimalSize = mid;
            minSize = mid + 1;
          } else {
            maxSize = mid - 1;
          }
        }

        if (optimalSize < smallestFitSize) {
          smallestFitSize = optimalSize;
        }
      });

      globalFontSize = smallestFitSize;
      displayCurrentSlide();
    }

    function displayCurrentSlide() {
      const textEl = document.getElementById('bulletin-text');
      const counterEl = document.getElementById('slide-counter');

      if (!textEl) return;

      textEl.classList.add('fade-out');

      setTimeout(() => {
        textEl.textContent = itemsList[currentIndex] || '';
        textEl.style.fontSize = globalFontSize + 'px'; // Apply uniform font size

        if (counterEl) {
          counterEl.textContent = `${currentIndex + 1} of ${itemsList.length}`;
        }
        
        textEl.classList.remove('fade-out');
      }, 250);
    }

    function startRotation() {
      stopRotation();
      if (itemsList.length <= 1) return;

      rotationTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % itemsList.length;
        displayCurrentSlide();
      }, 10000);
    }

    function stopRotation() {
      if (rotationTimer) {
        clearInterval(rotationTimer);
        rotationTimer = null;
      }
    }

    function renderPendingNotice() {
      const container = document.getElementById('bulletin-container');
      container.innerHTML = `
        <div class="pending-notice">
          Today's bulletin has not been published yet.
          <div class="pending-subtitle">Please check back later for announcements.</div>
        </div>
      `;
    }

    function displayError(message) {
      document.getElementById('bulletin-container').innerHTML = `
        <div class="error-notice">${message}</div>
      `;
    }

    window.addEventListener('resize', () => {
      calculateGlobalFontSize();
    });

    fetchBulletin();
    setInterval(fetchBulletin, 15 * 60 * 1000);
  </script>
</body>
</html>
