<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Daily Bulletin</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      padding: clamp(1.5rem, 3%, 3rem);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2%, 2rem);
      border-bottom: 4px solid var(--patriots-red);
      padding-bottom: clamp(0.75rem, 2%, 1.5rem);
      margin-bottom: clamp(1rem, 2%, 2rem);
      flex-shrink: 0;
    }

    .logo {
      height: clamp(50px, 10vw, 90px);
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bulletin-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
    }

    .bulletin-card {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 8px solid var(--patriots-red);
      border-radius: 12px;
      padding: clamp(1.5rem, 3%, 2.5rem);
      flex: 1;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    .bulletin-date {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 700;
      color: var(--patriots-silver);
      margin-bottom: clamp(1rem, 2%, 1.5rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(176, 183, 188, 0.2);
      padding-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .bulletin-content {
      font-size: clamp(1.15rem, 2.8vw, 1.8rem);
      line-height: 1.6;
      color: var(--patriots-white);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .pending-notice, .error-notice {
      background-color: rgba(255, 255, 255, 0.05);
      border-left: 8px solid var(--patriots-silver);
      border-radius: 12px;
      padding: clamp(2rem, 4vw, 4rem);
      font-size: clamp(1.3rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: var(--patriots-white);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .pending-subtitle {
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-weight: 400;
      color: var(--patriots-silver);
      margin-top: 1rem;
    }

    footer {
      margin-top: clamp(1rem, 2%, 1.5rem);
      padding-top: clamp(0.5rem, 1%, 0.75rem);
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      opacity: 0.8;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Daily Bulletin</h1>
  </header>

  <div class="bulletin-wrapper" id="bulletin-container">
    <div class="pending-notice">
      Checking for today's bulletin...
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuH1BgocMX1hFpZ2PKK8Hjn4o_-AvtfGTMY1t6sdMWsGmFvCv8tQjOQu29-bgkAyLpL3uTtaNnmpVj/pub?gid=0&single=true&output=csv";

    const fetchEndpoints = [
      sheetCsvUrl,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(sheetCsvUrl)}`,
      `https://corsproxy.io/?${encodeURIComponent(sheetCsvUrl)}`
    ];

    function updateLastUpdatedTime() {
      const now = new Date();
      document.getElementById('last-updated').textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', timeZone: 'America/Chicago'
      });
    }

    function isToday(dateString) {
      if (!dateString) return false;
      
      // Clean up common spreadsheet date quirks
      const cleanDate = dateString.trim().replace(/^"|"$/g, '');
      const parsedDate = new Date(cleanDate);
      if (isNaN(parsedDate.getTime())) return false;

      const today = new Date();
      return parsedDate.getFullYear() === today.getFullYear() &&
             parsedDate.getMonth() === today.getMonth() &&
             parsedDate.getDate() === today.getDate();
    }

    function parseCSV(csvText) {
      const lines = [];
      let currentRow = [];
      let currentToken = '';
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentToken += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentToken.trim());
          if (currentRow.length > 0) lines.push(currentRow);
          currentRow = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      if (currentToken || currentRow.length > 0) {
        currentRow.push(currentToken.trim());
        lines.push(currentRow);
      }
      return lines;
    }

    async function fetchBulletin() {
      for (let endpoint of fetchEndpoints) {
        try {
          const response = await fetch(endpoint);
          if (!response.ok) throw new Error(`HTTP Status ${response.status}`);
          
          const rawCsv = await response.text();
          const parsedRows = parseCSV(rawCsv);

          // Cell A1 (Row 0, Col 0) = Date
          // Cell B1 (Row 0, Col 1) = Bulletin Content
          const sheetDateStr = (parsedRows[0] && parsedRows[0][0]) ? parsedRows[0][0] : '';
          const bulletinContent = (parsedRows[0] && parsedRows[0][1]) ? parsedRows[0][1] : '';

          renderBulletin(sheetDateStr, bulletinContent);
          updateLastUpdatedTime();
          return;
        } catch (error) {
          console.warn("Fetch attempt failed, trying fallback...", error);
        }
      }

      displayError("Unable to load daily bulletin. Please check your Google Sheet publish settings.");
    }

    function renderBulletin(sheetDateStr, bulletinContent) {
      const container = document.getElementById('bulletin-container');

      if (isToday(sheetDateStr)) {
        const cleanDate = sheetDateStr.trim().replace(/^"|"$/g, '');
        const formattedDate = new Date(cleanDate).toLocaleDateString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
        });

        container.innerHTML = `
          <div class="bulletin-card">
            <div class="bulletin-date">${formattedDate}</div>
            <div class="bulletin-content">${escapeHtml(bulletinContent)}</div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="pending-notice">
            Today's bulletin has not been published yet.
            <div class="pending-subtitle">Please check back later for announcements.</div>
          </div>
        `;
      }
    }

    function displayError(message) {
      document.getElementById('bulletin-container').innerHTML = `
        <div class="error-notice">${message}</div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    fetchBulletin();
    setInterval(fetchBulletin, 15 * 60 * 1000);
  </script>
</body>
</html>
