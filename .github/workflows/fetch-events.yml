name: Fetch and Cache iCal Events

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-ical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download iCal Feed
        run: |
          mkdir -p data
          curl -sL "https://gobound.com/mn/schools/winemac/calendar/ical/2417b68941d2412" -o data/events.ics

      - name: Commit and Push Updated Events
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cached iCal events [skip ci]" && git push)
