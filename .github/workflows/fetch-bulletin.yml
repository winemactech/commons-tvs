name: Fetch and Cache Daily Bulletin

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fetch-bulletin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Google Sheet CSV
        run: |
          mkdir -p data
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuH1BgocMX1hFpZ2PKK8Hjn4o_-AvtfGTMY1t6sdMWsGmFvCv8tQjOQu29-bgkAyLpL3uTtaNnmpVj/pub?output=csv" -o data/bulletin.csv
          
          echo "Downloaded Bulletin size:"
          ls -lh data/bulletin.csv

      - name: Commit and Push Updated Bulletin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bulletin.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bulletin CSV [skip ci]" && git push)
