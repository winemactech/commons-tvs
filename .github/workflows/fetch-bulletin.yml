name: Fetch Daily Bulletin

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

permissions:
  contents: write

jobs:
  fetch-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Bulletin Text
        run: |
          mkdir -p data
          # Replace URL below with your Google Doc published URL or source text link
          curl -sL "YOUR_BULLETIN_SOURCE_URL" -o data/bulletin.txt

      - name: Commit and Push Updated Bulletin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bulletin.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bulletin [skip ci]" && git push)
