name: Fetch and Cache Workshop Sheet

on:
  schedule:
    # Runs every hour at minute 10
    - cron: '10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Google Sheet CSV
        run: |
          mkdir -p data
          curl -sL "https://docs.google.com/spreadsheets/d/1vThRzIsO5m9R89j564JmG3eE8yBfPoxh1lJptmUjJ9M/gviz/tq?tqx=out:csv&sheet=Sheet1" -o data/workshops.csv

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/workshops.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cached workshop CSV [skip ci]" && git push)
