name: Fetch and Cache Workshop iCal

on:
  schedule:
    # Runs every hour at minute 10
    - cron: '10 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fetch-ical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-ical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Google Calendar ICS
        run: |
          mkdir -p data
          curl -sLf "https://calendar.google.com/calendar/ical/c_4f54bc4f958f2d59ad9513e63ae74f4b93bbfbfad062779ad04ec950a4bf855e%40group.calendar.google.com/public/basic.ics" -o data/workshops.ics

      - name: Commit and Push Updated ICS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workshops.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cached workshop ICS [skip ci]" && git push)
