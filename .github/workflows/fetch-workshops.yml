name: Fetch and Cache Workshop iCal

on:
  schedule:
    # Runs every hour at minute 10
    - cron: '10 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fetch-ical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-ical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Google Calendar ICS
        run: |
          mkdir -p data
          curl -sL "https://calendar.google.com/calendar/ical/c_c6eb8cba768819ec8b04b3667f90300918b642725cc07d46b300a5d568925cb5%40group.calendar.google.com/public/basic.ics" -o data/workshops.ics
          
          # Verify file size in logs
          echo "Downloaded file size:"
          ls -lh data/workshops.ics
          
          # Fail step if file is completely empty
          if [ ! -s data/workshops.ics ]; then
            echo "Error: Downloaded ICS file is empty!"
            exit 1
          fi

      - name: Commit and Push Updated ICS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workshops.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cached workshop ICS [skip ci]" && git push)
