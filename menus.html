<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win-E-Mac Patriot Menu</title>
  <style>
    :root {
      --patriots-navy: #002244;
      --patriots-red: #C60C30;
      --patriots-blue: #0056B3;
      --patriots-silver: #B0B7BC;
      --patriots-white: #FFFFFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--patriots-navy);
      color: var(--patriots-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      border-bottom: 4px solid var(--patriots-red);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      height: 90px;
      flex-shrink: 0;
    }

    .logo {
      height: 70px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.1;
      white-space: nowrap;
    }

    .menu-wrapper {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* 3-Column Grid Container */
    .menu-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.75rem;
      height: 100%;
    }

    /* Column Card Base */
    .menu-card {
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    /* Red Card (Lunches) */
    .menu-card.card-red {
      background-color: var(--patriots-red);
    }

    /* Light Blue Card (Breakfast) */
    .menu-card.card-blue {
      background-color: var(--patriots-blue);
    }

    .card-header {
      padding-bottom: 0.85rem;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .card-title {
      font-size: clamp(1.2rem, 1.8vw, 1.65rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .card-date {
      font-size: clamp(0.95rem, 1.3vw, 1.2rem);
      font-weight: 600;
      opacity: 0.85;
      margin-top: 0.3rem;
      letter-spacing: 0.5px;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      font-size: clamp(1.1rem, 1.8vw, 1.45rem);
      font-weight: 600;
      line-height: 1.35;
    }

    .menu-item-line {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .menu-item-line::before {
      content: "•";
      font-weight: bold;
      opacity: 0.8;
    }

    .no-data-text {
      font-style: italic;
      opacity: 0.8;
      font-weight: 500;
      text-align: center;
      margin-top: 2rem;
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(176, 183, 188, 0.2);
      color: var(--patriots-silver);
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      opacity: 0.8;
      text-align: right;
      flex-shrink: 0;
    }

    /* Scrollbar for long description lists */
    .card-body::-webkit-scrollbar {
      width: 4px;
    }
    .card-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i0.wp.com/wemschools.org/wp-content/uploads/2019/09/logo.png" alt="Win-E-Mac Patriots Logo" class="logo">
    <h1>Breakfast &amp; Lunch</h1>
  </header>

  <div class="menu-wrapper">
    <div class="menu-grid" id="menu-grid">
      <div class="menu-card card-red"><div class="card-header"><div class="card-title">Loading...</div></div></div>
      <div class="menu-card card-blue"><div class="card-header"><div class="card-title">Loading...</div></div></div>
      <div class="menu-card card-red"><div class="card-header"><div class="card-title">Loading...</div></div></div>
    </div>
  </div>

  <footer>Last updated: <span id="last-updated">Just now</span></footer>

  <script>
    const menuIcsUrl = "https://raw.githubusercontent.com/winemactech/commons-tvs/main/data/menu.ics";
    const CACHE_KEY = 'wem_menu_ical_cache_v7';

    function updateLastUpdatedTime(timestamp) {
      const displayDate = timestamp ? new Date(timestamp) : new Date();
      document.getElementById('last-updated').textContent = displayDate.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago'
      });
    }

    function parseICSDate(icsDateStr) {
      if (!icsDateStr) return null;
      const cleanStr = icsDateStr.split(':').pop().trim().replace('Z', '');

      if (cleanStr.length >= 8) {
        const year = parseInt(cleanStr.substring(0, 4), 10);
        const month = parseInt(cleanStr.substring(4, 6), 10) - 1;
        const day = parseInt(cleanStr.substring(6, 8), 10);
        return new Date(year, month, day);
      }
      return null;
    }

    function parseICS(icsData) {
      const events = [];
      const lines = icsData.split(/\r\n|\n|\r/);
      let currentEvent = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        while (i + 1 < lines.length && (lines[i + 1].startsWith(' ') || lines[i + 1].startsWith('\t'))) {
          line += lines[i + 1].substring(1);
          i++;
        }

        if (line.startsWith('BEGIN:VEVENT')) {
          currentEvent = {};
        } else if (line.startsWith('END:VEVENT')) {
          if (currentEvent && currentEvent.start) {
            events.push(currentEvent);
          }
          currentEvent = null;
        } else if (currentEvent) {
          if (line.startsWith('SUMMARY:')) {
            currentEvent.title = line.substring(8).replace(/\\,/g, ',').replace(/\\;/g, ';').trim();
          } else if (line.startsWith('DTSTART')) {
            currentEvent.start = parseICSDate(line);
          } else if (line.startsWith('DESCRIPTION:')) {
            currentEvent.description = line.substring(12)
              .replace(/\\,/g, ',')
              .replace(/\\;/g, ';')
              .replace(/\\n/g, '\n')
              .trim();
          }
        }
      }
      return events;
    }

    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function formatDateSubHeader(dateObj) {
      return dateObj.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }

    function formatDescriptionLines(descText) {
      if (!descText || !descText.trim()) return '<div class="no-data-text">No menu items listed</div>';

      const lines = descText.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

      if (lines.length === 0) return '<div class="no-data-text">No menu items listed</div>';

      return lines.map(line => `<div class="menu-item-line"><span>${escapeHtml(line)}</span></div>`).join('');
    }

    function renderMenuCards(events) {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Determine next school day (Tomorrow, or Monday if Fri/Sat)
      const nextDay = new Date(today);
      const dayOfWeek = today.getDay();
      if (dayOfWeek === 5) {
        nextDay.setDate(today.getDate() + 3);
      } else if (dayOfWeek === 6) {
        nextDay.setDate(today.getDate() + 2);
      } else {
        nextDay.setDate(today.getDate() + 1);
      }

      const nextDayLabel = (dayOfWeek === 5 || dayOfWeek === 6) ? "Monday's" : "Tomorrow's";

      const todayEvents = events.filter(e => isSameDay(e.start, today));
      const nextDayEvents = events.filter(e => isSameDay(e.start, nextDay));

      // Route events by Title keyword
      const todayLunch = todayEvents.find(e => (e.title || '').toLowerCase().includes('lunch')) || todayEvents[0];
      const nextBreakfast = nextDayEvents.find(e => (e.title || '').toLowerCase().includes('breakfast')) || nextDayEvents[0];
      const nextLunch = nextDayEvents.find(e => (e.title || '').toLowerCase().includes('lunch')) || (nextDayEvents.length > 1 ? nextDayEvents[1] : null);

      const cardsConfig = [
        {
          type: 'card-red',
          header: "Today's Lunch",
          dateStr: formatDateSubHeader(today),
          description: todayLunch ? todayLunch.description : ""
        },
        {
          type: 'card-blue',
          header: `${nextDayLabel} Breakfast`,
          dateStr: formatDateSubHeader(nextDay),
          description: nextBreakfast ? nextBreakfast.description : ""
        },
        {
          type: 'card-red',
          header: `${nextDayLabel} Lunch`,
          dateStr: formatDateSubHeader(nextDay),
          description: nextLunch ? nextLunch.description : ""
        }
      ];

      cardsConfig.forEach(card => {
        const cardElem = document.createElement('div');
        cardElem.className = `menu-card ${card.type}`;
        cardElem.innerHTML = `
          <div class="card-header">
            <div class="card-title">${escapeHtml(card.header)}</div>
            <div class="card-date">${escapeHtml(card.dateStr)}</div>
          </div>
          <div class="card-body">${formatDescriptionLines(card.description)}</div>
        `;
        grid.appendChild(cardElem);
      });
    }

    async function fetchMenu() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try {
          const { ics, time } = JSON.parse(cached);
          renderMenuCards(parseICS(ics));
          updateLastUpdatedTime(time);
        } catch (e) {
          console.error("Cache read error:", e);
        }
      }

      try {
        const response = await fetch(menuIcsUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const icsText = await response.text();
        
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ics: icsText, time: Date.now() }));
        renderMenuCards(parseICS(icsText));
        updateLastUpdatedTime(Date.now());
      } catch (error) {
        console.warn("Menu fetch error:", error);
        if (!cached) {
          renderMenuCards([]);
        }
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    fetchMenu();
  </script>
</body>
</html>
